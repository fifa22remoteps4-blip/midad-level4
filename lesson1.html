    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');
        
        :root {
            --font-main: 'Baloo Bhaijaan 2', cursive;
            --font-content: 'Noto Naskh Arabic', serif;
        }

        body { 
            font-family: var(--font-main);
            background: #f8fafc;
            margin: 0;
            overflow-x: hidden;
            min-height: 100vh;
        }

        .font-content { 
            font-family: var(--font-content); 
            line-height: 2.8; 
            word-spacing: 0.4em; 
            letter-spacing: 0.03em;
        }
        
        .mesh-bg {
            background-image: 
                radial-gradient(at 0% 0%, rgba(86, 36, 208, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(15, 129, 148, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .card-royal {
            background: white;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 25px 50px -12px rgba(86, 36, 208, 0.12);
        }

        .btn-3d {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-bottom-width: 8px;
            border-bottom-style: solid;
        }
        .btn-3d:active { transform: translateY(6px); border-bottom-width: 2px; margin-top: 6px; }

        .btn-purple { background-color: #5624d0; border-bottom-color: #3b1796; color: white; }
        .btn-pink { background-color: #d024b0; border-bottom-color: #96177b; color: white; }
        .btn-teal { background-color: #0f8194; border-bottom-color: #0a5c6a; color: white; }
        .btn-emerald { background-color: #10b981; border-bottom-color: #047857; color: white; }
        .btn-amber { background-color: #f59e0b; border-bottom-color: #b45309; color: white; }
        .btn-sky { background-color: #0ea5e9; border-bottom-color: #0369a1; color: white; }
        .btn-rose { background-color: #f43f5e; border-bottom-color: #be123c; color: white; }

        @keyframes shake {
            0%, 100% { transform: translateX(0) rotate(0deg); }
            25% { transform: translateX(-8px) rotate(-1deg); }
            50% { transform: translateX(8px) rotate(1deg); }
            75% { transform: translateX(-8px) rotate(-1deg); }
        }
        .animate-shake { animation: shake 0.4s ease-in-out; }
        
        @keyframes shield-flash {
            0%, 100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); border-color: inherit; }
            50% { box-shadow: 0 0 30px 15px rgba(56, 189, 248, 0.6); border-color: #38bdf8 !important; }
        }
        .animate-shield { animation: shield-flash 0.6s ease-out; }

        .slide-up-fade { animation: slideUp 0.5s ease-out forwards; }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Skin Styles */
        .skin-scroll { background-color: #fffbeb; border-color: #fde68a; color: #78350f; }
        .skin-scroll .content-box { background: transparent; border: none; }
        .skin-tablet { background-color: #0f172a; border-color: #334155; color: #f8fafc; }
        .skin-tablet .content-box { background: #1e293b; border: 2px solid #475569; color: #cbd5e1; }
        .theme-var { background-color: #f0f9ff; border-color: #bae6fd; }
        .theme-var .q-box { background: #1e293b; color: #38bdf8; border: 4px solid #334155; border-radius: 1rem; position: relative; }
        .theme-var .q-box::before { content: 'REC ●'; position: absolute; top: 10px; left: 15px; color: #ef4444; font-family: monospace; font-weight: bold; animation: pulse 2s infinite; }
        .theme-var .ans-btn { background: white; border-color: #94a3b8; color: #1e293b; border-radius: 0.5rem; }
        .theme-det { background-color: #fffbeb; border-color: #fde68a; color: #78350f; }
        .theme-det .q-box { background: #fef3c7; color: #78350f; border: 2px dashed #b45309; }
        .theme-det .ans-btn { background: #fdf6e3; border-color: #d6d3d1; color: #44403c; }
        .theme-scale { background-color: #f0fdf4; border-color: #bbf7d0; }
        .theme-scale .q-box { background: white; color: #064e3b; border: 4px solid #10b981; border-radius: 3rem; }
        .theme-scale .ans-btn { background: white; border-color: #86efac; color: #064e3b; border-radius: 3rem; }
        .skin-hacker { background-color: #020617; border-color: #10b981; color: #4ade80; font-family: monospace; }
        .skin-detective { background-color: #fef3c7; border-color: #d97706; color: #78350f; }
        .skin-doctor { background-color: #f0f9ff; border-color: #0284c7; color: #0c4a6e; }
        .skin-kitchen { background-color: #fff7ed; border-color: #f97316; }
        .skin-builder { background-color: #f8fafc; border-color: #64748b; }
        .skin-factory { background-color: #e2e8f0; border-color: #94a3b8; color: #1e293b; }
        .skin-studio { background-color: #faf5ff; border-color: #d8b4fe; }
        .skin-diver { background-color: #ecfeff; border-color: #7dd3fc; }

        .memory-card { perspective: 1000px; cursor: pointer; }
        .memory-card-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .memory-card.flipped .memory-card-inner { transform: rotateY(180deg); }
        .memory-card-front, .memory-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 1.5rem; display: flex; align-items: center; justify-content: center; }
        .memory-card-front { background: linear-gradient(135deg, #3b82f6, #8b5cf6); transform: rotateY(0deg); border: 4px solid #fff; }
        .memory-card-back { background: white; transform: rotateY(180deg); border: 4px solid #8b5cf6; }
    </style>
</head>

            ];

            useEffect(() => {

            }, [isTimerRunning, isPaused]);

            const endFluencyAttempt = () => {
                setIsTimerRunning(false); setIsPaused(false);
                const newRecords = [...fluencyRecords, timer];
                setFluencyRecords(newRecords); setCoins(c => c + 20);
                
                if (newRecords.length === 3) setTimeout(() => onComplete(), 1500);
                else setFluencyPhase('decision');
            };

            if (!skin) return <SkinSelector title="تَحَدِّي الطَّلَاقَةِ 🚀" desc="الْهَدَفُ هُوَ السُّرْعَةُ وَالْإِيقَاع، لَكِنْ بِأَيِّ شَكْلٍ تُفَضِّلُ التَّحَدِّي؟" skins={skinsData} onSelect={setSkin} theme={theme}/>;

            const skinClass = skin === 'marathon' ? 'border-emerald-200 bg-white' : skin === 'studio' ? 'skin-studio border-4' : 'skin-diver border-4';
            const iconName = skin === 'marathon' ? 'Zap' : skin === 'studio' ? 'Ear' : 'Target';
            const skinTitle = skin === 'marathon' ? 'سِبَاقُ الْمَارَاثُون' : skin === 'studio' ? 'نَجْمُ الْإِذَاعَةِ (ON AIR)' : 'غَوَّاصُ الْأَعْمَاقِ';
            const timerColor = skin === 'marathon' ? 'text-emerald-600' : skin === 'studio' ? 'text-purple-600' : 'text-sky-600';
            const btnBg = skin === 'marathon' ? 'bg-emerald-500 border-emerald-700 hover:bg-emerald-400' : skin === 'studio' ? 'bg-purple-500 border-purple-700 hover:bg-purple-400' : 'bg-sky-500 border-sky-700 hover:bg-sky-400';

            return (
                <div className={`card-royal p-10 w-full max-w-4xl text-center mx-auto shadow-2xl border-4 ${skinClass}`}>
                    <h2 className={`text-4xl font-black mb-6 flex items-center justify-center gap-4 ${timerColor}`}><AppIcon name={iconName} size={40}/> {skinTitle}</h2>
                    {fluencyRecords.length > 0 && (
                        <div className="flex justify-center gap-4 mb-8">
                            {fluencyRecords.map((rec, i) => {
                                const isBest = rec === Math.min(...fluencyRecords);
                                return (
                                    <div key={i} className={`px-4 py-2 rounded-xl border-2 font-bold text-lg flex items-center gap-2 ${isBest ? 'bg-amber-100 border-amber-400 text-amber-700 shadow-md transform scale-110' : 'bg-white border-slate-200 text-slate-500 opacity-80'}`}>
                                        <span>مُحَاوَلَة {i+1}:</span>
                                        <span className="font-black text-2xl font-main">{rec} ث</span>
                                        {isBest && <span>👑</span>}
                                    </div>
                                )
                            })}
                        </div>
                    )}
                    {fluencyPhase === 'ready' && (
                        <div className="py-10">
                            <p className="text-2xl font-bold text-slate-600 mb-8">اقْرَأِ النَّصَّ بِصَوْتٍ عَالٍ 3 مَرَّات. حَاوِلْ كَسْرَ رَقْمِكَ الْقِيَاسِيِّ فِي كُلِّ مَرَّة!</p>
                            <button onClick={() => { setTimer(0); setIsTimerRunning(true); setIsPaused(false); setFluencyPhase('running'); }} className={`px-16 py-6 rounded-full text-3xl font-black btn-3d shadow-lg transition-all text-white ${btnBg}`}>إِبْدَأِ الْعَدَّادَ ⏱️</button>
                        </div>
                    )}
                    {fluencyPhase === 'running' && (
                        <div>
                            <div className={`text-7xl font-black mb-8 ${isPaused ? 'text-amber-500' : timerColor}`}>{timer} {skin === 'diver' ? 'أُكْسُجِين' : 'ثَانِيَة'}</div>
                            <div className={`bg-white/80 p-10 rounded-[3rem] border-2 border-slate-200 mb-10 transition-all shadow-inner ${isPaused ? 'blur-sm grayscale opacity-50' : 'blur-0'}`}>
                                <p className="text-3xl md:text-4xl font-content text-slate-800 text-justify leading-loose">{data.fluencyText}</p>
                            </div>
                            <div className="flex justify-center gap-6">
                                <button onClick={() => setIsPaused(!isPaused)} className={`border-b-8 active:border-b-0 active:translate-y-2 text-2xl font-bold py-4 px-8 rounded-full shadow-md flex items-center gap-2 ${isPaused ? 'bg-amber-400 hover:bg-amber-500 text-amber-900 border-amber-600' : 'bg-slate-200 hover:bg-slate-300 text-slate-700 border-slate-400'}`}>
                                    <AppIcon name={isPaused ? "Play" : "Pause"} size={28} /> {isPaused ? 'اسْتِئْنَاف' : 'إِيقَاف مُؤَقَّت'}
                                </button>
                                {!isPaused && (
                                    <button onClick={endFluencyAttempt} className="bg-rose-500 hover:bg-rose-600 text-white border-b-8 border-rose-700 active:border-b-0 active:translate-y-2 text-2xl font-bold py-4 px-12 rounded-full shadow-md flex items-center gap-2">
                                        أَنْهَيْتُ الْقِرَاءَةَ <AppIcon name="Check" size={28}/>
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                    {fluencyPhase === 'decision' && (
                        <div className="py-10">
                            <div className="text-6xl mb-6">🎉</div>
                            <h3 className="text-4xl font-black text-slate-800 mb-4">وَقْتُكَ: {timer} ثَانِيَة</h3>
                            <p className="text-xl text-slate-500 font-bold mb-10">أَحْسَنْتَ! هَلْ تُرِيدُ كَسْرَ رَقْمِكَ فِي الْمُحَاوَلَةِ التَّالِيَة؟</p>
                            <button onClick={() => { setTimer(0); setIsTimerRunning(true); setIsPaused(false); setFluencyPhase('running'); }} className={`bg-white border-4 text-emerald-600 hover:bg-emerald-50 font-black text-2xl py-4 px-8 rounded-2xl btn-3d flex items-center justify-center gap-2 mx-auto`} style={{ borderColor: 'currentColor'}}>
                                🔄 أُرِيدُ كَسْرَ رَقْمِي!
                            </button>
                        </div>
                    )}
                </div>
            );
        };

        // --- ألعاب البنك (Bonus) ---
        const BonusMagnet = ({ data, onComplete, triggerError, bonusHints, setBonusHints }) => {
            const [wordIdx, setWordIdx] = useState(0);
            const [selected, setSelected] = useState([]);
            const [shuffledSyllables, setShuffledSyllables] = useState([]);
            const [isRevealed, setIsRevealed] = useState(false);
            
            const currentQ = data.syllables[wordIdx];

            useEffect(() => {
                if (currentQ) {
                    const syllablesWithIndex = currentQ.syllables.map((s, i) => ({ text: s, originalIdx: i }));
                    setShuffledSyllables(shuffleArray(syllablesWithIndex));
                    setSelected([]);
                    setIsRevealed(false);
                }
            }, [wordIdx, currentQ]);

            const handleSyllableClick = (sylObj) => {
                const expectedIdx = selected.length;
                if (sylObj.originalIdx === expectedIdx) {
                    const newSelected = [...selected, sylObj];
                    setSelected(newSelected);
                    if (newSelected.length === currentQ.syllables.length) {
                        setTimeout(() => {
                            if (wordIdx < data.syllables.length - 1) {
                                setWordIdx(w => w + 1);
                            } else {
                                onComplete();
                            }
                        }, 1000);
                    }
                } else {
                    triggerError();
                    setSelected([]);
                }
            };

            return (
                <div className={`card-royal p-12 w-full max-w-4xl text-center mx-auto shadow-2xl bg-sky-50 border-4 border-sky-200`}>
                    <div className="flex justify-between items-center mb-8 border-b-2 pb-6 border-sky-200">
                        <h2 className="text-4xl font-black text-sky-700 flex items-center gap-4"><AppIcon name="Puzzle" size={40}/> مُفَكِّكُ الْمَقَاطِعِ 🧲</h2>
                        <span className="font-bold text-sky-900 bg-sky-200 px-5 py-2 rounded-full text-xl">كلمة {wordIdx+1} / {data.syllables.length}</span>
                    </div>
                    
                    <p className="text-xl font-bold text-sky-800 mb-8">اقْرَأِ التَّلْمِيحَ، ثُمَّ اضْغَطْ عَلَى الْمَقَاطِعِ بِالتَّرْتِيبِ لِبِنَاءِ الْكَلِمَةِ!</p>
                    
                    <div className="bg-white p-6 sm:p-12 rounded-[3rem] border-2 border-sky-300 shadow-inner mb-10 flex flex-col justify-center items-center relative overflow-hidden">
                        <div className="mb-8 text-center w-full">
                            <p className="text-3xl font-black text-slate-700 font-content leading-relaxed">{currentQ.hint}</p>
                        </div>

                        <div className="flex justify-center items-center gap-1 font-content text-4xl sm:text-5xl font-black text-slate-800 min-h-[80px]" dir="rtl">
                            {selected.length === 0 && !isRevealed && (
                                <button onClick={() => {
                                    if (bonusHints > 0) {
                                        setBonusHints(h => h - 1);
                                        setIsRevealed(true);
                                    } else {
                                        alert("عذراً، لقد نفدت التلميحات!");
                                    }
                                }} className={`text-xl px-8 py-3 rounded-full font-bold transition-colors shadow-sm btn-3d flex items-center gap-2 ${bonusHints > 0 ? 'bg-sky-100 text-sky-700 border-sky-300 hover:bg-sky-200' : 'bg-slate-100 text-slate-400 border-slate-300 cursor-not-allowed'}`}>
                                    <AppIcon name="Lightbulb" size={24} /> كَشْفُ الْكَلِمَةِ (يَسْتَهْلِكُ تَلْمِيحاً)
                                </button>
                            )}
                            {selected.length === 0 && isRevealed && (
                                <span className="text-slate-300 blur-sm hover:blur-none transition-all duration-300">{currentQ.word}</span>
                            )}
                            <AnimatePresence>
                                {selected.map((s, i) => (
                                    <motion.span key={s.originalIdx} initial={{ y: 50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} className="syllable-block bg-emerald-100 border-emerald-400 text-emerald-800 mx-1">
                                        {s.text}
                                    </motion.span>
                                ))}
                            </AnimatePresence>
                        </div>
                    </div>

                    <div className="flex flex-wrap justify-center gap-4">
                        <AnimatePresence>
                            {shuffledSyllables.map((syl, i) => {
                                if (selected.find(s => s.originalIdx === syl.originalIdx)) return null;
                                return (
                                    <motion.button key={syl.originalIdx} initial={{ scale: 0 }} animate={{ scale: 1 }} exit={{ scale: 0 }} onClick={() => handleSyllableClick(syl)} className="bg-white border-4 border-sky-400 hover:bg-sky-100 text-sky-900 font-bold text-4xl py-4 px-6 rounded-2xl shadow-md transition-transform hover:-translate-y-2 font-content" dir="rtl">
                                        {syl.text}
                                    </motion.button>
                                );
                            })}
                        </AnimatePresence>
                    </div>
                </div>
            );
        };

        const BonusMemory = ({ data, onWin }) => {
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [disabled, setDisabled] = useState(false);

            useEffect(() => {
                const pairs = [...data.memoryCards, ...data.memoryCards];
                setCards(shuffleArray(pairs.map((word, idx) => ({ id: idx, word }))));
            }, [data]);

            const handleCardClick = (index) => {
                if (disabled || flipped.includes(index) || matched.includes(index)) return;

                const newFlipped = [...flipped, index];
                setFlipped(newFlipped);

                if (newFlipped.length === 2) {
                    setDisabled(true);
                    const firstMatch = cards[newFlipped[0]].word;
                    const secondMatch = cards[newFlipped[1]].word;

                    if (firstMatch === secondMatch) {
                        setMatched([...matched, newFlipped[0], newFlipped[1]]);
                        setFlipped([]);
                        setDisabled(false);
                        if (matched.length + 2 === cards.length) {
                            setTimeout(onWin, 1000);
                        }
                    } else {
                        setTimeout(() => {
                            setFlipped([]);
                            setDisabled(false);
                        }, 1000);
                    }
                }
            };

            return (
                <div className="flex flex-col items-center w-full max-w-2xl mx-auto">
                    <p className="text-xl font-bold text-slate-500 mb-6">طَابِقِ الْكَلِمَاتِ لِتَقْوِيَةِ ذَاكِرَتِكَ الْبَصَرِيَّة!</p>
                    <div className="grid grid-cols-4 gap-4 w-full">
                        {cards.map((card, i) => {
                            const isFlipped = flipped.includes(i) || matched.includes(i);
                            return (
                                <div key={i} className={`memory-card h-28 md:h-32 ${isFlipped ? 'flipped' : ''}`} onClick={() => handleCardClick(i)}>
                                    <div className="memory-card-inner">
                                        <div className="memory-card-front text-white text-4xl">
                                            <AppIcon name="Brain" size={40} />
                                        </div>
                                        <div className={`memory-card-back text-2xl md:text-3xl font-black font-content ${matched.includes(i) ? 'bg-emerald-100 text-emerald-700 border-emerald-400' : 'text-slate-700'}`}>
                                            {card.word}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const BonusSightWords = ({ data, onWin }) => {
            const [targetWord, setTargetWord] = useState("");
            const [gridWords, setGridWords] = useState([]);
            const [foundCount, setFoundCount] = useState(0);
            const totalTargets = 4;

            useEffect(() => {
                const target = data.sightWords[Math.floor(Math.random() * data.sightWords.length)];
                setTargetWord(target);

                const distractors = ["كُلُّ", "مِنْ", "إِلَى", "عَنْ", "قَدْ", "لَمْ", "لَنْ", "بَلْ", "أَوْ"];
                let words = [];
                for(let i=0; i<totalTargets; i++) words.push({ text: target, isTarget: true, found: false });
                for(let i=0; i<8; i++) words.push({ text: distractors[Math.floor(Math.random() * distractors.length)], isTarget: false, found: false });
                
                setGridWords(shuffleArray(words));
            }, [data]);

            const handleWordClick = (idx) => {
                const newWords = [...gridWords];
                if (newWords[idx].isTarget && !newWords[idx].found) {
                    newWords[idx].found = true;
                    setGridWords(newWords);
                    setFoundCount(c => c + 1);
                    if (foundCount + 1 === totalTargets) {
                        setTimeout(onWin, 800);
                    }
                }
            };

            return (
                <div className="flex flex-col items-center w-full max-w-2xl mx-auto">
                    <div className="bg-emerald-100 border-4 border-emerald-300 rounded-[2rem] p-6 mb-8 text-center w-full shadow-inner">
                        <p className="text-xl font-bold text-emerald-800 mb-2">ابْحَثْ عَنْ هَذِهِ الْكَلِمَةِ وَاصْطَدْهَا ({totalTargets - foundCount} مُتَبَقِّيَة):</p>
                        <span className="text-5xl font-black font-content text-emerald-600 tracking-wider">{targetWord}</span>
                    </div>
                    
                    <div className="grid grid-cols-3 md:grid-cols-4 gap-4 w-full">
                        {gridWords.map((item, i) => (
                            <button 
                                key={i} 
                                onClick={() => handleWordClick(i)}
                                disabled={item.found}
                                className={`h-20 rounded-2xl font-black font-content text-2xl transition-all border-b-4 
                                    ${item.found ? 'bg-emerald-500 text-white border-emerald-700 scale-90 opacity-50' : 'bg-white text-slate-700 hover:bg-emerald-50 hover:border-emerald-400 border-slate-200 shadow-sm'}`}
                            >
                                {item.text}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };


        // ==========================================
        // 🤝 مَحَطَّةُ التَّعَارُفِ وَالتَّحَدِّيَاتِ السَّرِيعَةِ (كَسْرُ الْجَلِيدِ + تَحْدِيدُ الْمُسْتَوَى)
        // ==========================================

            .replace(/[\u064B-\u0652\u0670\u0640]/g, "")

            .replace(/\u0649/g, "\u064A")
            .replace(/\u0629/g, "\u0647")

        // --- بنوك ألعاب كسر الجليد (تُسحب عشوائياً في كل جلسة) ---

                reacts: ['إِذَنْ سَنَسْتَمْتِعُ مَعاً! 💖', 'سَنَجْعَلُهَا أَجْمَلَ الْيَوْمَ! ✨', 'شُكْراً لِصِدْقِكَ — سَنَبْدَأُ بِخُطُوَاتٍ صَغِيرَةٍ. 🤝'] },

                reacts: ['خَرَائِطُ وَكُنُوزٌ! 🧭', 'عَقْلٌ عَالِمٌ! 🧪', 'صَدِيقُ الْمَخْلُوقَاتِ! 🐘', 'رُوحٌ رِيَاضِيَّةٌ! 🏆'] },

                q: 'لَوْ كَانَ مَعَكَ قِرْشٌ وَاحِدٌ فَقَطْ.. مَاذَا تَفْعَلُ بِهِ؟',
                opts: ['📕 أَشْتَرِي كِتَاباً قَدِيماً', '🍬 أَشْتَرِي حَلْوَى', '🐷 أَضَعُهُ فِي حَصَّالَتِي'],
                reacts: ['بَطَلُ قِصَّتِنَا اخْتَارَ مِثْلَكَ تَمَاماً! 📖', 'صَادِقٌ وَلَذِيذٌ! سَنَرَى مَاذَا اخْتَارَ بَطَلُنَا.. 🍭', 'مُدَبِّرٌ ذَكِيٌّ! لَكِنْ بَطَلَنَا لَهُ رَأْيٌ آخَرُ.. 💰'] }
        };

        const EITHER_POOL = [
            { kind: 'either', key: 'wr1', badge: 'لَوْ خُيِّرْتَ', icon: '⚖️', q: 'أَيُّهُمَا تَخْتَارُ؟',
              opts: ['📗 كِتَابٌ وَاحِدٌ تَقْرَؤُهُ أَلْفَ مَرَّةٍ', '📚 أَلْفُ كِتَابٍ تَقْرَأُ كُلَّ وَاحِدٍ مَرَّةً'],
              reacts: ['الْعُمْقُ! تُحِبُّ أَنْ تَفْهَمَ كُلَّ تَفْصِيلَةٍ. 🔍', 'الِاتِّسَاعُ! فُضُولُكَ لَا يَتَوَقَّفُ. 🌍'] },
            { kind: 'either', key: 'wr2', badge: 'لَوْ خُيِّرْتَ', icon: '⚖️', q: 'أَيْنَ تُفَضِّلُ أَنْ تَقْرَأَ؟',

            const copyReport = () => {

                        {!reaction && g.kind === 'dare' && (

                                <p className="text-slate-400 font-bold mt-6">تَحَدٍّ لِلْمُتْعَةِ فَقَطْ — لَا يُحْسَبُ فِي التَّقْيِيمِ 😄</p>
                            </div>

                        {!reaction && g.kind !== 'dare' && (

            }

            // ---------- 3. جسر التحديات ----------
            if (phase === 'bridge') return (
                <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} className={box}>

                    <h2 className={`text-4xl font-black mb-6 ${theme.iconColor}`}>سُعِدْتُ بِمَعْرِفَتِكَ يَا {name}!</h2>
                    <p className="text-2xl text-slate-600 font-bold mb-8 leading-relaxed">
                        الْآنَ خَمْسَةُ تَحَدِّيَاتٍ سَرِيعَةٍ: أَرْبَعَةٌ لِلْقِرَاءَةِ وَوَاحِدٌ لِلْكِتَابَةِ.<br/>
                        كُلُّ تَحَدٍّ لَهُ مُؤَقِّتٌ قَصِيرٌ.. وَلَا تَقْلَقْ، الْخَطَأُ هُنَا لَا يُنْقِصُ عُمْلَاتِكَ! 😉
                    </p>
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-3 mb-10">
                        {[...CHALLENGES.map(c => c.title), 'كَاتِبٌ سَرِيعٌ ✍️'].map((t, i) => (
                            <div key={i} className="bg-slate-50 border-2 border-slate-200 rounded-2xl p-4 font-black text-slate-600 text-sm">{t}</div>
                        ))}
                    </div>
                    <button onClick={() => setPhase('ch')} className={`px-16 py-6 rounded-full text-2xl font-black btn-3d text-white ${theme.btn}`}>ابْدَأِ التَّحَدِّي 🏁</button>
                </motion.div>
            );

            // ---------- 4. التحديات ----------
            if (phase === 'ch') return (
                <motion.div key={cur.id} initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }}
                    className={`${box} ${feedback === 'no' ? 'animate-shake border-rose-300' : ''}`}>
                    <div className="flex justify-between items-center mb-8">
                        <span className="bg-slate-100 text-slate-500 font-black px-5 py-2 rounded-full">تَحَدٍّ {chIdx + 1} / 5</span>
                        <h3 className="text-2xl md:text-3xl font-black text-slate-800">{cur.title}</h3>
                        <span className={`font-black text-2xl px-5 py-2 rounded-full ${timeLeft <= 5 ? 'bg-rose-100 text-rose-600 animate-pulse' : 'bg-emerald-100 text-emerald-700'}`}>⏱ {timeLeft}</span>
                    </div>

                    {cur.target && (
                        <div className="inline-block mb-6 px-10 py-6 rounded-3xl bg-slate-900 text-amber-300 font-content text-4xl md:text-5xl font-black border-4 border-dashed border-amber-400">

                    <p className="text-2xl md:text-3xl font-black font-content leading-[2.2] mb-8 text-slate-700 bg-slate-50 p-6 rounded-3xl border-r-8 border-r-amber-400 text-right">{cur.q}</p>

                    {cur.type === 'order' ? (

                                    : orderSel.map((oi, k) => (
                                        <motion.span key={k} initial={{ scale: 0.7 }} animate={{ scale: 1 }}

                                            {cur.opts[oi]}
                                        </motion.span>
                                    ))}
                            </div>
                            <div className="flex flex-wrap gap-3 justify-center">
                                {shuffled.filter(o => !orderSel.includes(o.i)).map(o => (

                                        className="px-7 py-5 rounded-2xl btn-3d border-4 border-slate-200 bg-white text-slate-700 hover:border-teal-400 hover:bg-teal-50 text-2xl md:text-3xl font-black font-content disabled:opacity-60">

                            </div>
                            {orderSel.length > 0 && !feedback && (
                                <button onClick={() => setOrderSel([])} className="mt-6 text-slate-400 font-black underline text-lg">↺ مَسْحُ الْجُمْلَةِ وَالْبَدْءُ مِنْ جَدِيدٍ</button>
                            )}
                        </div>
                    ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {shuffled.map(o => (
                                <button key={o.i} disabled={!!feedback} onClick={() => recordAnswer(o.i === cur.correct)}
                                    className="p-6 rounded-3xl btn-3d border-4 border-slate-200 bg-white text-slate-700 hover:border-sky-400 hover:bg-sky-50 text-2xl md:text-3xl font-black font-content disabled:opacity-60">
                                    {o.t}
                                </button>
                            ))}
                        </div>
                    )}

                    {feedback && (
                        <p className={`mt-8 text-3xl font-black ${feedback === 'ok' ? 'text-emerald-600' : 'text-rose-500'}`}>
                            {feedback === 'ok' ? 'أَحْسَنْتَ! +10 عُمْلَات 🎉' : 'لَا بَأْسَ.. سَنَتَدَرَّبُ عَلَيْهَا مَعاً 💪'}
                        </p>
                    )}
                </motion.div>
            );

            // ---------- 5. تحدي الكتابة ----------
            if (phase === 'write') return (
                <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className={box}>
                    <div className="flex justify-between items-center mb-8">
                        <span className="bg-slate-100 text-slate-500 font-black px-5 py-2 rounded-full">تَحَدٍّ 5 / 5</span>
                        <h3 className="text-2xl md:text-3xl font-black text-slate-800">كَاتِبٌ سَرِيعٌ ✍️</h3>
                        <span className="w-24"></span>
                    </div>

                    {flashLeft > 0 ? (
                        <div>
                            <p className="text-xl font-black text-slate-500 mb-6">تَأَمَّلِ الْكَلِمَةَ جَيِّداً.. سَتَخْتَفِي بَعْدَ <span className="text-rose-500 text-3xl">{flashLeft}</span> ثَوَانٍ!</p>
                            <div className="px-10 py-12 rounded-[2.5rem] bg-gradient-to-b from-sky-50 to-white border-4 border-sky-200 font-content text-6xl md:text-7xl font-black text-sky-800">
                                {WRITE_CHALLENGE.word}
                            </div>
                        </div>
                    ) : (
                        <div>
                            <p className="text-2xl font-black text-slate-700 mb-8 leading-relaxed">اُكْتُبِ الْكَلِمَةَ الَّتِي رَأَيْتَهَا (التَّشْكِيلُ غَيْرُ مَطْلُوبٍ):</p>
                            <input value={typed} onChange={e => setTyped(e.target.value)} autoFocus placeholder="اكْتُبْ هُنَا..."
                                className="w-full max-w-lg mx-auto block text-center text-4xl font-black font-content p-6 rounded-3xl border-4 border-slate-200 focus:border-sky-400 outline-none mb-8 bg-slate-50" />
                            <button onClick={submitWrite} disabled={!typed.trim()}
                                className={`px-16 py-6 rounded-full text-2xl font-black btn-3d text-white ${typed.trim() ? 'bg-sky-500 border-sky-700' : 'bg-slate-300 border-slate-400 cursor-not-allowed'}`}>
                                تَسْلِيمُ الْإِجَابَةِ ✔
                            </button>
                        </div>
                    )}
                </motion.div>
            );

            // ---------- 6. النتيجة ----------
            return (
                <motion.div initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} className={box}>
                    <div className="text-7xl mb-4">🏁</div>
                    <h2 className={`text-4xl font-black mb-2 ${theme.iconColor}`}>بِطَاقَةُ {name}</h2>
                    <p className="text-xl text-slate-500 font-bold mb-8">نَتِيجَةُ التَّحَدِّيَاتِ السَّرِيعَةِ</p>

                    <div className="flex flex-wrap justify-center gap-6 mb-10">
                        <div className="bg-slate-50 border-2 border-slate-200 rounded-3xl px-10 py-6">
                            <div className="text-sm font-black text-slate-400 mb-1">النَّتِيجَة</div>
                            <div className="text-5xl font-black text-slate-800">{score}<span className="text-2xl text-slate-400">/5</span></div>
                        </div>
                        <div className={`border-4 rounded-3xl px-10 py-6 ${level.cls}`}>
                            <div className="text-sm font-black opacity-70 mb-1">الْمُسْتَوَى</div>
                            <div className="text-3xl font-black">{level.name}</div>
                        </div>
                    </div>

                    <p className="text-2xl font-bold text-slate-600 font-content leading-[2.2] mb-8 bg-amber-50 border border-amber-200 rounded-3xl p-6">{level.tip}</p>

                    <div className="text-right mb-10">
                        <h3 className="text-2xl font-black text-slate-700 mb-4">تَفْصِيلُ الْمَهَارَاتِ:</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            {results.map((r, i) => (
                                <div key={i} className={`p-5 rounded-2xl border-2 flex items-start gap-3 ${r.ok ? 'bg-emerald-50 border-emerald-200' : 'bg-rose-50 border-rose-200'}`}>
                                    <span className="text-2xl">{r.ok ? '✅' : '🔧'}</span>
                                    <div>
                                        <div className={`font-black text-lg ${r.ok ? 'text-emerald-700' : 'text-rose-700'}`}>{r.skill}</div>
                                        {!r.ok && <div className="text-slate-600 font-bold text-sm mt-1 leading-relaxed">{r.fix}</div>}
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex flex-wrap gap-4 justify-center">
                        <button onClick={copyReport} className="px-8 py-5 rounded-full text-xl font-black btn-3d bg-slate-700 border-slate-900 text-white">📋 نَسْخُ تَقْرِيرِ الْمُعَلِّمِ</button>
                        <button onClick={() => onFinish({ name, level: level.name, score, answers, weak: weak.map(w => w.skill) })}
                            className={`px-12 py-5 rounded-full text-2xl font-black btn-3d text-white ${theme.btn}`}>
                            إِلَى الْقِصَّةِ الْمُصَوَّرَةِ 📖
                        </button>
                    </div>
                </motion.div>
            );
        };

        const App = () => {
            const [mode, setMode] = useState('map');
            const [gender, setGender] = useState((new URLSearchParams(location.search).get('h')==='girl')?'girl':'boy');
            const [coins, setCoins] = useState(50);
            const [progress, setProgress] = useState(0);
            const [completed, setCompleted] = useState([]);
            const [targetSt, setTargetSt] = useState(null);
            const [shake, setShake] = useState(false);
            
            const [bonusHints, setBonusHints] = useState(0);
            const [bonusShields, setBonusShields] = useState(0);
            const [shieldActive, setShieldActive] = useState(false);
            const [perksCalculated, setPerksCalculated] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);
            const [studentProfile, setStudentProfile] = useState(null);

            const heroData = gender ? LESSON_CONTENT[gender] : null;
            const theme = gender ? THEMES[gender] : null;

            useEffect(() => {
                if (mode === 'reward' && !perksCalculated) {
                    if (coins >= 500) { setBonusHints(3); setBonusShields(2); }
                    else if (coins >= 400) { setBonusHints(2); setBonusShields(1); }
                    else if (coins >= 250) { setBonusHints(1); setBonusShields(0); }
                    else { setBonusHints(0); setBonusShields(0); }
                    setPerksCalculated(true);
                }
            }, [mode, coins, perksCalculated]);

            const triggerError = () => {
                if (mode.startsWith('bonus_') && bonusShields > 0) {
                    setBonusShields(prev => prev - 1);
                    setShieldActive(true);
                    setTimeout(() => setShieldActive(false), 600);
                    return; 
                }
                setShake(true); 
                setCoins(prev => Math.max(0, prev - 2));
                setTimeout(() => setShake(false), 500);
            };

            const completeStation = (currentId) => {
                if (!completed.includes(currentId)) {
                    const newComp = [...completed, currentId];

                                            </p>
                                        )}
                                        <p className="text-3xl text-slate-700 font-bold mb-4">جَمَعْتَ <span className="text-amber-500 font-black text-4xl">{coins}</span> عُمْلَةً ذَهَبِيَّة.</p>
                                        
                                        {/* صندوق عرض الرتبة والامتيازات */}
                                        <div className="bg-white p-8 rounded-3xl border-4 border-emerald-100 shadow-lg w-full mb-10">
                                            <h3 className="text-2xl font-black text-emerald-600 mb-6 border-b-2 border-emerald-50 pb-4">تَقْيِيمُ الْأَدَاءِ وَالْمُكَافَآت:</h3>
                                            
                                            <div className="flex justify-around items-center mb-6">
                                                <div className="flex flex-col items-center gap-2">
                                                    <span className="text-sm font-bold text-slate-400 uppercase tracking-widest">الرُّتْبَة</span>
                                                    <span className={`text-2xl font-black px-4 py-1 rounded-lg ${coins >= 500 ? 'bg-indigo-100 text-indigo-700' : coins >= 400 ? 'bg-amber-100 text-amber-700' : coins >= 250 ? 'bg-slate-200 text-slate-700' : 'bg-orange-100 text-orange-700'}`}>
                                                        {coins >= 500 ? 'مَاسِيَّة 💎' : coins >= 400 ? 'ذَهَبِيَّة 🥇' : coins >= 250 ? 'فِضِّيَّة 🥈' : 'بُرُونْزِيَّة 🥉'}
                                                    </span>
                                                </div>
                                            </div>

                                            <div className="flex justify-center gap-6">
                                                <div className="bg-slate-50 p-4 rounded-2xl flex-1 flex flex-col items-center justify-center border border-slate-200">
                                                    <AppIcon name="Lightbulb" size={32} className={bonusHints > 0 ? "text-yellow-400 mb-2" : "text-slate-300 mb-2"} />
                                                    <span className="font-bold text-slate-600 text-sm">تَلْمِيحَاتٌ (مُسَاعَدَة)</span>
                                                    <span className="text-3xl font-black text-slate-800">+{bonusHints}</span>
                                                </div>
                                                <div className="bg-slate-50 p-4 rounded-2xl flex-1 flex flex-col items-center justify-center border border-slate-200">
                                                    <AppIcon name="Shield" size={32} className={bonusShields > 0 ? "text-sky-400 mb-2" : "text-slate-300 mb-2"} />
                                                    <span className="font-bold text-slate-600 text-sm">دُرُوعُ حِمَايَةٍ (فُرَص)</span>
                                                    <span className="text-3xl font-black text-slate-800">+{bonusShields}</span>
                                                </div>
                                            </div>
                                            
                                            {coins < 250 && <p className="text-rose-500 font-bold mt-6 text-sm">اجْمَعْ أَكْثَرَ مِنْ 250 عُمْلَةً لِتَحْصُلَ عَلَى امْتِيَازَاتٍ تُسَاعِدُكَ فِي بَنْكِ الْأَلْعَاب!</p>}
                                        </div>

                                        {/* المحاكاة الوظيفية - بطاقة قارئ المستقبل */}
                                        <div className="bg-slate-700 border-4 border-amber-500 p-8 rounded-[2.5rem] mb-10 text-right relative overflow-hidden w-full max-w-3xl mx-auto">
                                            <div className="absolute -left-10 -top-10 text-9xl opacity-10">📜</div>
                                            <h3 className="text-2xl font-black text-amber-400 mb-4 flex items-center gap-3"><AppIcon name="BookOpen" size={32}/> الْمُحَاكَاةُ الْوَظِيفِيَّةُ (تَأَمُّلُ الذَّاتِ)</h3>
                                            
                                            <div className="bg-slate-800 p-6 rounded-2xl border border-slate-600 mb-6 shadow-inner relative z-10">
                                                <p className="text-2xl font-bold text-amber-50 leading-[2.2] font-content mb-4 pb-4 border-b border-slate-600">
                                                    {heroData.homework}
                                                </p>
                                                <p className="text-lg font-bold text-slate-400 mb-3 font-main">نَصُّ الْمُذَكَّرَاتِ لِلْقِرَاءَةِ أَمَامَ الْعَائِلَةِ:</p>
                                                <p className="text-2xl font-bold text-slate-200 leading-[2.8] font-content bg-slate-900 p-4 rounded-xl border border-slate-700">
                                                    {heroData.fluencyText}
                                                </p>
                                            </div>
                                            
                                            <button onClick={handleCopyHomework} className="bg-amber-500 hover:bg-amber-400 text-white font-black text-xl py-4 px-8 rounded-xl flex items-center justify-center gap-3 w-full transition-colors relative z-10 btn-3d border-amber-700">
                                                نَسْخُ الْمُهِمَّةِ مَعَ النَّصِّ لِلْمُشَارَكَةِ <span className="text-2xl">📋</span>
                                            </button>
                                        </div>

                                        <div className="flex gap-4 w-full justify-center">
                                            <button onClick={() => setMode('bonus_hub')} className="px-8 py-5 rounded-[2rem] text-2xl font-black btn-3d bg-amber-500 hover:bg-amber-400 text-white border-amber-700 flex items-center gap-2">
                                                <AppIcon name="Gamepad2" /> دُخُول بَنْك الْأَلْعَاب
                                            </button>
                                            <button onClick={() => window.location.reload()} className={`px-8 py-5 rounded-[2rem] text-xl font-black btn-3d text-white ${theme.btn}`}>
                                                خُرُوج لِلرَّئِيسِيَّة
                                            </button>
                                        </div>
                                    </motion.div>
                                )}

                            </AnimatePresence>
                        </main>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
