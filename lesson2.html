<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِداد — المستوى الرابع | الوحدة الأولى</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');

  :root{--accent:#5624d0;--accent-dark:#3b1796;--accent-soft:#f3efff;--ink:#1e293b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Baloo Bhaijaan 2',cursive;color:var(--ink);min-height:100vh;background:#f8fafc;
    background-image:radial-gradient(at 0% 0%,rgba(86,36,208,.08) 0px,transparent 50%),
                     radial-gradient(at 100% 0%,rgba(15,129,148,.08) 0px,transparent 50%),
                     radial-gradient(at 100% 100%,rgba(245,158,11,.05) 0px,transparent 50%);
    background-attachment:fixed}
  .content{font-family:'Noto Naskh Arabic',serif;line-height:2.8;word-spacing:.4em;letter-spacing:.03em}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  .card{background:#fff;border-radius:2.2rem;border:4px solid #f1f5f9;
    box-shadow:0 25px 50px -12px rgba(86,36,208,.12);padding:26px}

  .btn-3d{transition:all .2s cubic-bezier(.175,.885,.32,1.275);border:0;border-bottom-width:8px;
    border-bottom-style:solid;border-radius:999px;cursor:pointer;font-family:inherit;font-weight:800;
    padding:15px 22px;font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;gap:.4em;width:100%}
  .btn-3d:active{transform:translateY(6px);border-bottom-width:2px;margin-top:6px}
  .btn-accent{background:var(--accent);border-bottom-color:var(--accent-dark);color:#fff}
  .btn-ghost{background:#f1f5f9;border-bottom-color:#cbd5e1;color:#64748b;font-size:.95rem;padding:11px}

  .opt{display:block;width:100%;background:#fff;border:3px solid #e2e8f0;border-bottom:7px solid #cbd5e1;
    border-radius:1.1rem;padding:15px 18px;margin-bottom:11px;font-family:'Noto Naskh Arabic',serif;
    font-size:1.28rem;font-weight:700;color:var(--ink);text-align:right;cursor:pointer;transition:.15s}
  .opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-3px)}
  .opt:disabled{opacity:.45;cursor:not-allowed}
  .opt.ok{background:#dcfce7;border-color:#16a34a;border-bottom-color:#15803d}
  .opt.bad{background:#fee2e2;border-color:#ef4444;border-bottom-color:#b91c1c}

  #hud{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    border-bottom:2px solid rgba(86,36,208,.12);display:none}
  #hud.on{display:block}
  #hud .in{max-width:1000px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.02rem}
  #st-name{font-weight:800;color:#64748b;font-size:.92rem;text-align:center;flex:1}
  .icon-btn{background:none;border:0;cursor:pointer;font-size:1.3rem;font-family:inherit}

  .map-head{text-align:center;margin:26px 0 34px}
  .map-head h1{font-size:2.6rem;font-weight:800;color:var(--accent);margin-bottom:8px;line-height:1.6}
  .map-head p{font-size:1.05rem;font-weight:700;color:#94a3b8}
  .group-label{font-size:1.02rem;font-weight:800;color:#94a3b8;background:#e2e8f0;display:inline-block;
    padding:8px 24px;border-radius:999px;margin-bottom:16px}
  .group-label.write{color:#0f8194;background:#cffafe;border:1px solid #a5f3fc}
  .st-grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr);margin-bottom:34px}
  @media(min-width:720px){.st-grid{grid-template-columns:repeat(4,1fr)}}
  .st-card{background:#fff;border-radius:2rem;border:2px solid #fff;box-shadow:0 10px 26px -14px rgba(0,0,0,.28);
    padding:18px 12px;text-align:center;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .25s cubic-bezier(.175,.885,.32,1.275),box-shadow .25s}
  .st-card:hover{transform:translateY(-7px);box-shadow:0 22px 38px -16px rgba(86,36,208,.35)}
  .st-card .ico{width:62px;height:62px;border-radius:1.5rem;display:flex;align-items:center;
    justify-content:center;font-size:1.9rem;margin:0 auto 12px}
  .st-card h3{font-weight:800;font-size:.96rem;line-height:1.7}
  .st-card .done{position:absolute;inset:0;background:rgba(255,255,255,.86);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;font-size:2.6rem;z-index:5}
  .finish-wrap{text-align:center;margin:10px auto 34px;max-width:420px}

  .st-intro{text-align:center}
  .st-intro .big{width:110px;height:110px;border-radius:2.4rem;display:flex;align-items:center;
    justify-content:center;font-size:3.4rem;margin:0 auto 22px}
  .st-intro h2{font-size:1.9rem;font-weight:800;margin-bottom:22px}
  .infobox{text-align:right;background:#f8fafc;border-radius:1.4rem;padding:18px;margin-bottom:12px;border:2px solid #e2e8f0}
  .infobox .lb{font-size:.78rem;font-weight:800;color:#94a3b8;margin-bottom:4px}
  .infobox .vl{font-family:'Noto Naskh Arabic',serif;font-weight:700;line-height:2;color:#475569;font-size:1.02rem}
  .infobox.treat{background:#fff1f2;border-color:#fecdd3}
  .infobox.treat .lb{color:#fb7185}
  .infobox.treat .vl{color:#9f1239}

  .frame{display:flex;gap:16px;align-items:stretch;background:#fff;border:3px solid #eef2f7;
    border-radius:1.6rem;padding:14px;margin-bottom:16px;box-shadow:0 14px 30px -20px rgba(0,0,0,.45)}
  .panel{border-radius:1.1rem;display:block;box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}
  .frame .panel{height:300px;width:auto;flex-shrink:0}
  .bubble{flex:1;display:flex;align-items:center;font-size:1.3rem;line-height:2.5;color:var(--ink);
    background:#f8fafc;border-radius:1.1rem;padding:16px 18px}
  .bubble.pre{background:#fffbeb;color:#78350f;font-size:1.14rem;line-height:2.3}
  @media(max-width:660px){.frame{flex-direction:column;gap:12px}
    .frame .panel{height:225px;margin:0 auto}.bubble{font-size:1.12rem;line-height:2.2}}

  .qframe{position:relative;background:linear-gradient(135deg,#fffbeb,#fef9ee);border:3px solid #e7d9b5;
    border-radius:1.6rem;padding:30px 26px 22px;margin-bottom:16px;box-shadow:0 14px 30px -20px rgba(120,90,20,.5)}
  .qframe::before,.qframe::after{content:'۞';position:absolute;top:10px;color:#d4b46a;font-size:1.3rem}
  .qframe::before{right:16px}.qframe::after{left:16px}
  .qhead{text-align:center;font-weight:800;color:#92400e;font-size:1.05rem;margin-bottom:12px;
    padding-bottom:10px;border-bottom:2px dashed #e7d9b5}
  .qtext{font-size:1.3rem;line-height:2.5;color:#3f2f10;text-align:justify}
  .qsrc{text-align:left;font-size:.8rem;font-weight:800;color:#a98a58;margin-top:10px}
  .qframe.reflect{background:linear-gradient(135deg,#f3efff,#e0f2fe);border-color:#c4b5fd}
  .qframe.reflect .qtext{color:#3b1796;text-align:center;font-weight:700}
  .qframe.reflect::before,.qframe.reflect::after{color:#a78bfa}

  .glossary{margin-top:16px;background:#f5f3ff;border:2px solid #ddd6fe;border-radius:1.4rem;padding:16px}
  .gtitle{font-weight:800;color:var(--accent-dark);margin-bottom:10px;font-size:1rem}
  .grow{display:flex;gap:10px;align-items:baseline;font-family:'Noto Naskh Arabic',serif;
    padding:7px 0;border-bottom:1px dashed #ddd6fe;line-height:1.9}
  .grow:last-child{border-bottom:0}
  .grow b{color:var(--accent);font-size:1.1rem;min-width:8.5em;font-weight:700}
  .grow span{color:#475569;font-size:1rem;font-weight:600}

  .wisdom{background:linear-gradient(135deg,#f3efff,#e0f2fe);border:3px solid var(--accent);
    border-radius:1.6rem;padding:24px;text-align:center;font-family:'Noto Naskh Arabic',serif;
    font-size:1.35rem;font-weight:700;color:#3b1796;line-height:2.4}
  .golden{background:linear-gradient(135deg,#fffbeb,#fef3c7);border:3px solid #fbbf24;
    border-radius:1.4rem;padding:16px;margin-top:16px;text-align:center}
  .golden .gw{font-family:'Noto Naskh Arabic',serif;font-size:1.72rem;font-weight:800;color:#b45309}
  .golden .gm{font-family:'Noto Naskh Arabic',serif;color:#92400e;font-weight:600;margin-top:4px}
  .golden .gl{font-size:.76rem;font-weight:800;color:#a98a58}

  .hunt{background:#f8fafc;border-radius:1.6rem;padding:22px;text-align:center}
  .w{cursor:pointer;padding:1px 6px;border-radius:8px;transition:.15s;display:inline-block}
  .w:hover{background:#fef3c7}
  .w.hit{background:#16a34a;color:#fff;font-weight:800}
  .shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .toneline{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:1.4rem;padding:20px;
    font-size:1.35rem;text-align:center;color:var(--ink)}
  .flashbox{min-height:110px;display:flex;align-items:center;justify-content:center;background:var(--ink);
    color:#fff;border-radius:1.4rem;font-size:1.1rem;opacity:.5;transition:opacity .15s;padding:18px}
  .flashbox.show{font-size:1.9rem;opacity:1;font-weight:700}

  .slot{min-height:70px;border:4px dashed #cbd5e1;border-radius:1.4rem;background:#f8fafc;display:flex;
    flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding:12px;margin-bottom:16px;
    font-family:'Noto Naskh Arabic',serif;font-size:1.85rem;font-weight:800}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .chip-b{background:#fff;border:3px solid #cbd5e1;border-bottom-width:6px;border-radius:1rem;padding:8px 16px;
    font-family:'Noto Naskh Arabic',serif;font-size:1.55rem;font-weight:800;cursor:pointer;transition:.15s;color:var(--ink)}
  .chip-b:hover{border-color:var(--accent);transform:translateY(-3px)}

  textarea,input.fld{width:100%;border:4px dashed #cbd5e1;border-radius:1.4rem;padding:15px;
    font-family:'Noto Naskh Arabic',serif;font-size:1.2rem;line-height:2.2;outline:none;color:var(--ink);background:#fff}
  textarea{min-height:112px;resize:vertical}
  textarea:focus,input.fld:focus{border-color:var(--accent);background:var(--accent-soft)}
  .scenario{background:#f3efff;border:2px solid #ddd6fe;border-radius:1.4rem;padding:16px;margin-bottom:14px;
    font-family:'Noto Naskh Arabic',serif;font-weight:700;color:#3b1796;line-height:2}
  .badreply{background:#fef2f2;border:2px solid #fca5a5;border-radius:1.4rem;padding:16px;
    font-family:'Noto Naskh Arabic',serif;font-weight:600;color:#9f1239;line-height:2.1}
  .modelbox{background:#f0fdf4;border:2px solid #86efac;border-radius:1.4rem;padding:16px;margin-top:14px;
    font-family:'Noto Naskh Arabic',serif;font-weight:600;color:#14532d;line-height:2.1}
  .tag{display:inline-block;background:#fca5a5;color:#7f1d1d;font-family:'Baloo Bhaijaan 2',cursive;
    font-size:.76rem;font-weight:800;padding:3px 12px;border-radius:999px;margin-left:10px}
  .tag.ok{background:#86efac;color:#14532d}

  .fform{background:#fff;border:3px solid #e2e8f0;border-radius:1.6rem;padding:20px}
  .frow{margin-bottom:16px}
  .frow label{display:block;font-weight:800;color:#475569;margin-bottom:8px;font-size:1rem}
  .doc{background:#fffdf7;border:3px solid #e7d9b5;border-radius:1.4rem;padding:24px;margin-top:16px;
    font-family:'Noto Naskh Arabic',serif;line-height:2.4;color:#4a3a18;box-shadow:0 12px 26px -16px rgba(120,90,20,.45)}
  .doc h4{font-family:'Baloo Bhaijaan 2',cursive;font-weight:800;color:#92400e;font-size:1.22rem;
    text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px dashed #e7d9b5}
  .doc .line{display:flex;gap:10px;padding:8px 0;border-bottom:1px dotted #e7d9b5;font-weight:600}
  .doc .line:last-child{border-bottom:0}
  .doc .line b{color:#92400e;min-width:9em}
  .phone{background:#0f172a;border-radius:2rem;padding:16px;border:5px solid #334155}
  .phone .pbar{display:flex;justify-content:space-between;color:#94a3b8;font-size:.72rem;
    font-weight:800;margin-bottom:12px;padding:0 6px}
  .msg{border-radius:1.2rem;padding:12px 16px;margin-bottom:10px;font-family:'Noto Naskh Arabic',serif;
    line-height:2;max-width:85%;font-weight:600}
  .msg.them{background:#334155;color:#e2e8f0}
  .msg.me{background:#5624d0;color:#fff;margin-right:auto}
  .signboard{background:#fff;border:6px double var(--accent);border-radius:1.4rem;padding:22px;margin-top:16px;
    text-align:center;font-family:'Noto Naskh Arabic',serif}
  .signboard h4{font-family:'Baloo Bhaijaan 2',cursive;color:var(--accent);font-size:1.38rem;font-weight:800;margin-bottom:14px}
  .signboard ol{text-align:right;padding-right:22px;line-height:2.6;font-weight:600;color:#334155}

  .nudge{background:#fff7ed;color:#c2410c;border:2px solid #fdba74;border-radius:1.2rem;padding:12px;
    text-align:center;font-weight:800;margin-top:14px}
  .info{background:var(--accent-soft);color:var(--accent-dark);border-radius:1.2rem;padding:14px;
    font-family:'Noto Naskh Arabic',serif;font-weight:700;text-align:center;line-height:2;margin-top:14px}
  .count{text-align:center;font-weight:800;color:#64748b;margin-bottom:14px}
  .count b{color:var(--accent)}
  .kicker{font-size:.8rem;font-weight:800;color:#94a3b8;text-align:center;margin-bottom:6px}
  h2.title{font-size:1.6rem;font-weight:800;text-align:center;color:var(--accent);margin-bottom:6px}
  .sub{font-size:.94rem;font-weight:700;color:#94a3b8;text-align:center;margin-bottom:18px}
  .bar-m{height:12px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:4px}
  .bar-m>i{display:block;height:100%;border-radius:999px;transition:width .9s cubic-bezier(.4,0,.2,1)}

  .st-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;
    padding-top:18px;border-top:2px dashed #e2e8f0}
  .navb{background:#f1f5f9;border:0;border-bottom:5px solid #cbd5e1;border-radius:999px;cursor:pointer;
    font-family:inherit;font-weight:800;color:#475569;padding:11px 16px;font-size:.88rem;
    transition:all .18s cubic-bezier(.175,.885,.32,1.275);max-width:42%;overflow:hidden;
    white-space:nowrap;text-overflow:ellipsis}
  .navb:hover{background:var(--accent-soft);color:var(--accent);border-bottom-color:var(--accent)}
  .navb:active{transform:translateY(3px);border-bottom-width:2px}
  .navb.mid{flex-shrink:0;font-size:1.15rem;padding:11px 18px}
  .doneCard{text-align:center}
  .doneCard .big{font-size:4rem;margin-bottom:10px}
  .doneCard h2{font-size:1.7rem;font-weight:800;color:#16a34a;margin-bottom:8px}
  .doneCard p{font-weight:700;color:#94a3b8;margin-bottom:22px}

  #toast{position:fixed;left:0;right:0;bottom:0;padding:16px;text-align:center;font-size:1.2rem;
    font-weight:800;color:#fff;z-index:60;transform:translateY(120%);transition:.3s}
  #toast.on{transform:translateY(0)}
  .fade{animation:fade .45s ease-out both}
  @keyframes fade{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>

<div id="hud">
  <div class="in">
    <button class="icon-btn" data-map="1" title="الخريطة">🗺️</button>
    <div class="chip">🪙 <span id="tok" style="color:var(--accent)">٠</span></div>
    <div id="st-name">مِداد</div>
    <div class="chip" style="color:#e07b1a">🔥 <span id="stk">٠</span></div>
  </div>
</div>

<div id="app" class="wrap" style="padding-top:8px;padding-bottom:60px"></div>

function stById(id){for(var i=0;i<STATIONS.length;i++)if(STATIONS[i].id===id)return STATIONS[i];return null}
function activeStations(){return STATIONS.filter(function(s){
  if(s.id==='form')return !!L.form;
  if(s.id==='sms') return !!L.sms;
  if(s.id==='sign')return !!L.sign;
  return true;})}

function view(h){$('#app').innerHTML=h;window.scrollTo({top:0,behavior:'instant'})}
function neighbours(){
  var a=activeStations(), i=-1;
  for(var k=0;k<a.length;k++) if(cur&&a[k].id===cur.id){i=k;break}
  return {prev:(i>0?a[i-1]:null), next:(i>=0&&i<a.length-1?a[i+1]:null)};
}
function stationNav(){
  var n=neighbours();
  return '<div class="st-nav">'+
    (n.prev?'<button class="navb" data-goto="'+n.prev.id+'">‹ '+n.prev.ic+' '+n.prev.name+'</button>':'<span></span>')+
    '<button class="navb mid" data-map="1" title="الخريطة">🗺️</button>'+
    (n.next?'<button class="navb" data-goto="'+n.next.id+'">'+n.next.ic+' '+n.next.name+' ›</button>':'<span></span>')+
  '</div>';
}
function setHud(on){
  $('#hud').classList.toggle('on',on!==false);
  $('#tok').textContent=num(S.tok);$('#stk').textContent=num(S.streak);
  $('#st-name').textContent=cur?(cur.ic+' '+cur.name):'مِداد';
}
function toast(txt,good,cb){
  var t=$('#toast');t.style.background=good?'#5624d0':'#0f8194';t.innerHTML=txt;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');if(cb)cb()},good?1050:1700);
}
function award(first){var g=first?12:6;g+=Math.min(S.streak,4)*2;S.tok+=g;return g}
function rec(k,v){S.scores[k].push(v)}
function pct(a){return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length*100):0}
function judge(ok,key,right,cb){
  if(ok){S.streak++;if(S.streak>S.best)S.best=S.streak;var f=S.tries===0;rec(key,f?1:0.5);
    var g=award(f);setHud();return toast(cheer()+' +'+num(g)+' 🪙',true,cb)}
  S.tries++;
  if(S.tries>=2){S.streak=0;rec(key,0);setHud();return toast('الصَّوَابُ: '+right+' 💪',false,cb)}
  S.streak=0;setHud();
  var n=$('#nudge');if(n){n.textContent='لَيْسَتْ هَذِهِ… لَكَ فُرْصَةٌ أَخِيرَة! 💪';n.style.display='block'}
}
function finishStation(){
  if(cur&&done.indexOf(cur.id)<0)done.push(cur.id);
  S.tries=0;S.si=0;

  var got=acts.filter(function(s){return done.indexOf(s.id)>=0}).length;

      var d=done.indexOf(s.id)>=0;
      return '<div class="st-card" data-st="'+s.id+'">'+
        '<div class="ico" style="background:'+s.b+';color:'+s.c+'">'+s.ic+'</div>'+

        '<input class="fld" id="g'+i+'" placeholder="'+g.ph[i]+'" autocomplete="off"></div>'}).join('')+'</div>'+
    '<div class="info">💡 '+g.hint+'</div>'+
    '<div style="margin-top:16px"><button class="btn-3d btn-accent" data-sign="1">📌 عَلِّقِ اللَّافِتَة</button></div>'+
    '<div id="out"></div><div id="nudge" class="nudge" style="display:none"></div>'+stationNav()+'</div>');
  setTimeout(function(){var e=$('#g0');if(e)e.focus()},80);
}

function report(){
  cur=null;setHud();
  var sk=[{k:'fluency',n:'الطَّلَاقَة',i:'⚡',c:'#10b981'},{k:'comp',n:'الْفَهْم',i:'💬',c:'#0ea5e9'},
    {k:'accuracy',n:'الدِّقَّة',i:'🎯',c:'#e11d48'},{k:'syll',n:'الْمَقَاطِع',i:'🧱',c:'#0284c7'},
    {k:'write',n:'الْكِتَابَةُ الْوَظِيفِيَّة',i:'✍️',c:'#5624d0'}];
  var vals=sk.map(function(s){return pct(S.scores[s.k])});
  var ov=Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length);
  var bd=ov>=85?['🏆','قَارِئٌ بَدِيع','#f59e0b']:ov>=70?['🥈','قَارِئٌ مُتَمَكِّن','#0ea5e9']
        :ov>=50?['🥉','فِي الطَّرِيقِ الصَّحِيح','#5624d0']:['🌱','بِدَايَةٌ جَمِيلَة','#64748b'];
  view('<div class="card fade" style="margin-top:14px;text-align:center">'+
    '<div style="font-size:3.4rem">'+bd[0]+'</div>'+
    '<div class="kicker">مِعْيَارُ مِداد — '+L.title+'</div>'+
    '<h2 class="title" style="color:'+bd[2]+'">'+bd[1]+'</h2>'+
    '<div style="font-size:2.9rem;font-weight:800;color:var(--accent)">'+num(ov)+'<span style="font-size:1.2rem">%</span></div>'+
    '<div class="sub">🪙 '+num(S.tok)+' تُوكِنْز · 🔥 '+num(S.best)+(S.wpm?' · ⏱️ '+num(S.wpm)+' كَلِمَة/دَقِيقَة':'')+'</div>'+
    '<div class="wisdom" style="font-size:1.1rem;margin:16px 0">'+L.wisdom+'</div>'+
    '<div style="text-align:right;margin:18px 0">'+
    sk.map(function(s,i){return '<div style="margin-bottom:13px"><div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:4px">'+
      '<span>'+s.i+' '+s.n+'</span><span style="color:'+s.c+'">'+num(vals[i])+'%</span></div>'+
      '<div class="bar-m"><i style="width:'+vals[i]+'%;background:'+s.c+'"></i></div></div>'}).join('')+'</div>'+
    '<button class="btn-3d btn-accent" data-hub="1">🏠 إِلَى الْوَحْدَة</button>'+
    '<div style="margin-top:10px"><button class="btn-3d btn-ghost" data-map="1">🗺️ الْخَرِيطَة</button></div></div>');
}

document.addEventListener('click',function(e){
  var t=e.target;
  if(t.closest('[data-hub]')){location.href='index.html';return}
  if(t.closest('[data-map]')){map();return}
  if(t.closest('[data-report]')){report();return}
  var sc=t.closest('[data-st]'); if(sc){stIntro(sc.dataset.st);return}
  var sb=t.closest('[data-start]'); if(sb){runStation(sb.dataset.start);return}
  var gt=t.closest('[data-goto]'); if(gt){runStation(gt.dataset.goto);return}

  if(t.closest('[data-lit]')){
    S.si++;
    if(S.si>=L.comic.length){rec('comp',1);finishStation();}else rComic();
    return;
  }
  var op=t.closest('[data-c]');
  if(op&&cur&&cur.id==='comp'){
    var ok=op.dataset.c==='1';
    if(!ok){op.classList.add('bad','shake');op.disabled=true}else op.classList.add('ok');
    var it=L.questions[S.si], r=it.opts.filter(function(o){return o[1]})[0][0];
    judge(ok,'comp',r,function(){if(ok||S.tries>=2){S.si++;S.tries=0;
      if(S.si>=L.questions.length)finishStation();else rComp();}});
    return;
  }
  var tn=t.closest('[data-tc]');
  if(tn&&cur&&cur.id==='tone'){
    var okT=tn.dataset.tc==='1';
    if(!okT){tn.classList.add('bad','shake');tn.disabled=true}else tn.classList.add('ok');
    var itT=L.tones[S.si], rT=itT.opts.filter(function(o){return o[1]})[0][0];
    judge(okT,'comp',rT,function(){if(okT||S.tries>=2){S.si++;S.tries=0;
      if(S.si>=L.tones.length)finishStation();else rTone();}});
    return;
  }
  var fl=t.closest('[data-fl]');
  if(fl&&cur&&cur.id==='flash'){
    var okF=fl.dataset.fl==='1';
    if(!okF){fl.classList.add('bad','shake');fl.disabled=true}else fl.classList.add('ok');
    judge(okF,'fluency',L.flash[S.si].t,function(){if(okF||S.tries>=2){S.si++;S.tries=0;
      if(S.si>=L.flash.length)finishStation();else rFlash();}});
    return;
  }
  var w=t.closest('.w');
  if(w&&cur&&cur.id==='accuracy'){
    var i=+w.dataset.i, blk=L.hunt[i];
    if(w.classList.contains('hit'))return;
    if(blk[1]){w.classList.add('hit');w.textContent=blk[2];S.tok+=8;setHud();
      var found=$('#txt').querySelectorAll('.hit').length, tot=L.hunt.filter(function(x){return x[1]}).length;
      $('#fc').textContent=num(found);
      if(found>=tot){S.streak++;if(S.streak>S.best)S.best=S.streak;rec('accuracy',1);setHud();
        setTimeout(function(){toast('صَيْدٌ كَامِل! 🎯',true,finishStation)},300)}
    }else{w.classList.add('shake');setTimeout(function(){w.classList.remove('shake')},400)}
    return;
  }
  if(t.closest('[data-skip]')&&cur&&cur.id==='accuracy'){
    var f2=$('#txt').querySelectorAll('.hit').length, t2=L.hunt.filter(function(x){return x[1]}).length;
    rec('accuracy',f2/t2);S.streak=0;setHud();
    return toast('وَجَدْتَ '+num(f2)+' مِنْ '+num(t2)+' 👍',false,finishStation);
  }
  var ch=t.closest('[data-ch]');
  if(ch&&cur&&cur.id==='syll'){
    var it2=L.syll[S.si], idx=+ch.dataset.ch, slot=$('#slot'), placed=slot.children.length;
    if(idx===placed){var sp=document.createElement('span');sp.textContent=it2.parts[idx];slot.appendChild(sp);ch.remove();
      if(placed+1===it2.parts.length){S.streak++;if(S.streak>S.best)S.best=S.streak;rec('syll',1);
        var g=award(true);setHud();
        toast('بِنَاءٌ صَحِيح: '+it2.word+' +'+num(g)+' 🪙',true,function(){
          S.si++;if(S.si>=L.syll.length)finishStation();else rSyll();});}
    }else{ch.classList.add('shake');setTimeout(function(){ch.classList.remove('shake')},400);
      var n=$('#nudge');if(n){n.textContent='ابْدَأْ بِالْمَقْطَعِ الْأَوَّلِ مِنَ الْيَمِين ➡️';n.style.display='block'}}
    return;
  }
  if(t.closest('[data-skip]')&&cur&&cur.id==='syll'){
    var it3=L.syll[S.si];rec('syll',0);S.streak=0;setHud();
    return toast('الْكَلِمَةُ: '+it3.word,false,function(){
      S.si++;if(S.si>=L.syll.length)finishStation();else rSyll();});
  }
  if(t.closest('[data-done]')&&cur&&cur.id==='fluency'){
    var sec=(Date.now()-S.t0)/1000, words=L.chunks.join(' ').split(/\s+/).filter(Boolean).length;
    var wpm=Math.round(words/(Math.max(sec,1)/60));if(wpm>320)wpm=320;
    if(sec>=6){S.wpm=wpm;rec('fluency',Math.min(1,wpm/120))}else rec('fluency',.6);
    setHud();
    return toast(sec>=6?('⏱️ '+num(wpm)+' كَلِمَة/دَقِيقَة!'):'أَحْسَنْت! 📖',true,finishStation);
  }
  if(t.closest('[data-wdone]')){finishStation();return}

  if(t.closest('[data-form]')&&cur&&cur.id==='form'){
    var f=L.form, vals=[], empty=false;
    f.fields.forEach(function(fl,i){var v=(($('#f'+i)||{}).value||'').trim();if(!v)empty=true;vals.push(v)});
    if(empty){var nf=$('#nudge');if(nf){nf.textContent='أَكْمِلْ كُلَّ الْحُقُولِ لِتَخْرُجَ بِطَاقَتُك 📝';nf.style.display='block'}return}
    rec('write',1);var gf=award(true);setHud();
    $('#out').innerHTML='<div class="doc fade"><h4>'+f.docTitle+'</h4>'+
      f.fields.map(function(fl,i){return '<div class="line"><b>'+fl.label+'</b><span>'+esc(vals[i])+'</span></div>'}).join('')+
      '</div><div style="margin-top:16px"><button class="btn-3d btn-accent" data-wdone="1">أَنْهَيْتُ ✓</button></div>';
    var bf=$('[data-form]');bf.disabled=true;bf.style.opacity=.4;
    toast('بِطَاقَةٌ جَاهِزَة! +'+num(gf)+' 🪙',true);
    return;
  }
  if(t.closest('[data-sms]')&&cur&&cur.id==='sms'){
    var v=($('#bx')||{}).value||'', wc=v.trim().split(/\s+/).filter(Boolean).length;
    if(wc<4){var ns=$('#nudge');if(ns){ns.textContent='اكْتُبْ رَدًّا مِنْ أَرْبَعِ كَلِمَاتٍ فَأَكْثَر 💬';ns.style.display='block'}return}
    rec('write',wc>=8?1:.75);var gs=award(true);setHud();
    $('#sent').innerHTML='<div class="msg me">'+esc(v)+'</div>';
    $('#out').innerHTML='<div class="modelbox fade"><span class="tag ok">نَمُوذَجٌ 🌸</span>'+L.sms.model+'</div>'+
      '<div style="margin-top:16px"><button class="btn-3d btn-accent" data-wdone="1">أَنْهَيْتُ ✓</button></div>';
    var bs=$('[data-sms]');bs.disabled=true;bs.style.opacity=.4;
    toast('أُرْسِلَتْ! +'+num(gs)+' 🪙',true);
    return;
  }
  if(t.closest('[data-soft]')&&cur&&cur.id==='soften'){
    var vS=($('#bx')||{}).value||'', wcS=vS.trim().split(/\s+/).filter(Boolean).length;
    if(wcS<4){var nS=$('#nudge');if(nS){nS.textContent='اكْتُبْ رَدَّكَ فِي أَرْبَعِ كَلِمَاتٍ فَأَكْثَر 💬';nS.style.display='block'}return}
    var itS=L.soften[S.si];
    var harsh=/غبي|أحمق|اصمت|أكرهك|لن أ|لا فائدة|مزعج|كسول/.test(vS);
    rec('write',harsh?.5:(wcS>=8?1:.75));
    var gS=award(true);setHud();
    $('#out').innerHTML='<div class="modelbox fade"><span class="tag ok">نَمُوذَجٌ لَطِيف 🌸</span>'+itS.model+'</div>'+
      (harsh?'<div class="nudge" style="display:block">لَاحِظْ: مَا زَالَ فِي رَدِّكَ كَلِمَةٌ قَاسِيَة 💚</div>':'')+
      '<div style="margin-top:14px"><button class="btn-3d btn-accent" data-softnext="1">'+
      (S.si+1>=L.soften.length?'أَنْهَيْتُ ✓':'الْمَوْقِفُ التَّالِي ▶')+'</button></div>';
    var b=$('[data-soft]');if(b){b.disabled=true;b.style.opacity=.4}
    toast('رَدٌّ أَلْطَف! +'+num(gS)+' 🪙',true);
    return;
  }
  if(t.closest('[data-softnext]')){
    S.si++;if(S.si>=L.soften.length)finishStation();else rSoften();
    return;
  }
  if(t.closest('[data-sign]')&&cur&&cur.id==='sign'){
    var rules=[],bad=false;
    [0,1,2].forEach(function(i){var v=(($('#g'+i)||{}).value||'').trim();
      if(v.split(/\s+/).filter(Boolean).length<2)bad=true;rules.push(v)});
    if(bad){var ng=$('#nudge');if(ng){ng.textContent='كُلُّ قَانُونٍ كَلِمَتَانِ فَأَكْثَر 📜';ng.style.display='block'}return}
    rec('write',1);var gg=award(true);setHud();
    $('#out').innerHTML='<div class="signboard fade"><h4>'+L.sign.boardTitle+'</h4><ol>'+
      rules.map(function(r){return '<li>'+esc(r)+'</li>'}).join('')+'</ol></div>'+
      '<div style="margin-top:16px"><button class="btn-3d btn-accent" data-wdone="1">أَنْهَيْتُ ✓</button></div>';
    var bg=$('[data-sign]');bg.disabled=true;bg.style.opacity=.4;
    toast('لَافِتَةٌ رَائِعَة! +'+num(gg)+' 🪙',true);
    return;
  }
});

S.hero=(new URLSearchParams(location.search).get('h')==='girl')?'girl':'boy';
theme();
var sid=(new URLSearchParams(location.search).get('s')||'');
for(var q=0;q<STORIES.length;q++){if(STORIES[q].id===sid){L=STORIES[q];break}}
if(!L)L=STORIES[0];
map();
})();
</script>
