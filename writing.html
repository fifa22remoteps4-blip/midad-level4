<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مِداد — الكتابة</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap');

  :root{--accent:#5624d0;--accent-dark:#3b1796;--accent-soft:#f3efff;--ink:#1e293b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Baloo Bhaijaan 2',cursive;color:var(--ink);min-height:100vh;background:#f8fafc;
    background-image:radial-gradient(at 0% 0%,rgba(86,36,208,.08) 0px,transparent 50%),
                     radial-gradient(at 100% 0%,rgba(15,129,148,.08) 0px,transparent 50%),
                     radial-gradient(at 100% 100%,rgba(245,158,11,.05) 0px,transparent 50%);
    background-attachment:fixed}
  .nx{font-family:'Noto Naskh Arabic',serif}
  .wrap{max-width:1000px;margin:0 auto;padding:0 16px}
  .card{background:#fff;border-radius:2.2rem;border:4px solid #f1f5f9;
    box-shadow:0 25px 50px -12px rgba(86,36,208,.12);padding:26px}
  @media(max-width:560px){.card{padding:18px;border-radius:1.6rem}}

  .btn-3d{transition:all .2s cubic-bezier(.175,.885,.32,1.275);border:0;border-bottom-width:8px;
    border-bottom-style:solid;border-radius:999px;cursor:pointer;font-family:inherit;font-weight:800;
    padding:15px 22px;font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;gap:.4em;width:100%}
  .btn-3d:active{transform:translateY(6px);border-bottom-width:2px;margin-top:6px}
  .btn-accent{background:var(--accent);border-bottom-color:var(--accent-dark);color:#fff}
  .btn-ghost{background:#f1f5f9;border-bottom-color:#cbd5e1;color:#64748b;font-size:.95rem;padding:11px}
  .btn-3d:disabled{opacity:.45;cursor:not-allowed}

  .opt{display:block;width:100%;background:#fff;border:3px solid #e2e8f0;border-bottom:7px solid #cbd5e1;
    border-radius:1.1rem;padding:14px 18px;margin-bottom:11px;font-family:'Noto Naskh Arabic',serif;
    font-size:1.18rem;font-weight:700;color:var(--ink);text-align:right;cursor:pointer;transition:.15s;line-height:2}
  .opt:hover:not(:disabled){border-color:var(--accent);transform:translateY(-3px)}
  .opt:disabled{cursor:default}
  .opt.ok{background:#dcfce7;border-color:#16a34a;border-bottom-color:#15803d}
  .opt.bad{background:#fee2e2;border-color:#ef4444;border-bottom-color:#b91c1c}
  .opt.dim{opacity:.45}

  #hud{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);
    border-bottom:2px solid rgba(86,36,208,.12);display:none}
  #hud.on{display:block}
  #hud .in{max-width:1000px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:1.02rem}
  #st-name{font-weight:800;color:#64748b;font-size:.92rem;text-align:center;flex:1}
  .icon-btn{background:none;border:0;cursor:pointer;font-size:1.3rem;font-family:inherit}

  .map-head{text-align:center;margin:26px 0 30px}
  .map-head h1{font-size:2.4rem;font-weight:800;color:var(--accent);margin-bottom:6px;line-height:1.6}
  .map-head p{font-size:1.02rem;font-weight:700;color:#94a3b8}
  .tracks{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
  .pill{background:#fff;border:2px solid #e2e8f0;border-radius:999px;padding:6px 16px;font-weight:800;font-size:.86rem;color:#475569}
  .group-label{font-size:1.02rem;font-weight:800;display:inline-block;padding:8px 24px;border-radius:999px;margin-bottom:6px}
  .group-label.tech{color:#0f8194;background:#cffafe;border:1px solid #a5f3fc}
  .group-label.create{color:#b45309;background:#fef3c7;border:1px solid #fde68a}
  .group-sub{font-family:'Noto Naskh Arabic',serif;font-weight:700;color:#64748b;margin:6px 4px 16px;line-height:2}
  .st-grid{display:grid;gap:16px;grid-template-columns:repeat(2,1fr);margin-bottom:34px}
  @media(min-width:720px){.st-grid{grid-template-columns:repeat(4,1fr)}}
  .st-card{background:#fff;border-radius:2rem;border:2px solid #fff;box-shadow:0 10px 26px -14px rgba(0,0,0,.28);
    padding:18px 12px;text-align:center;cursor:pointer;position:relative;overflow:hidden;
    transition:transform .25s cubic-bezier(.175,.885,.32,1.275),box-shadow .25s}
  .st-card:hover{transform:translateY(-7px);box-shadow:0 22px 38px -16px rgba(86,36,208,.35)}
  .st-card .ico{width:62px;height:62px;border-radius:1.5rem;display:flex;align-items:center;
    justify-content:center;font-size:1.9rem;margin:0 auto 12px}
  .st-card h3{font-weight:800;font-size:.96rem;line-height:1.7}
  .st-card .stp{position:absolute;top:10px;right:12px;font-size:.72rem;font-weight:800;color:#cbd5e1}
  .st-card .done{position:absolute;inset:0;background:rgba(255,255,255,.86);backdrop-filter:blur(3px);
    display:flex;align-items:center;justify-content:center;font-size:2.6rem;z-index:5}
  .finish-wrap{text-align:center;margin:10px auto 18px;max-width:420px}

  .st-intro{text-align:center}
  .st-intro .big{width:110px;height:110px;border-radius:2.4rem;display:flex;align-items:center;
    justify-content:center;font-size:3.4rem;margin:0 auto 22px}
  .st-intro h2{font-size:1.9rem;font-weight:800;margin-bottom:22px}
  .infobox{text-align:right;background:#f8fafc;border-radius:1.4rem;padding:18px;margin-bottom:12px;border:2px solid #e2e8f0}
  .infobox .lb{font-size:.78rem;font-weight:800;color:#94a3b8;margin-bottom:4px}
  .infobox .vl{font-family:'Noto Naskh Arabic',serif;font-weight:700;line-height:2;color:#475569;font-size:1.02rem}
  .infobox.treat{background:#fff1f2;border-color:#fecdd3}
  .infobox.treat .lb{color:#fb7185}.infobox.treat .vl{color:#9f1239}

  .kicker{font-size:.8rem;font-weight:800;color:#94a3b8;text-align:center;margin-bottom:6px}
  h2.title{font-size:1.55rem;font-weight:800;text-align:center;color:var(--accent);margin-bottom:6px;line-height:1.7}
  .sub{font-size:.94rem;font-weight:700;color:#94a3b8;text-align:center;margin-bottom:18px;line-height:1.9}
  .lv{display:inline-block;font-size:.76rem;font-weight:800;padding:3px 14px;border-radius:999px;margin-bottom:10px}
  .q{font-family:'Noto Naskh Arabic',serif;font-size:1.3rem;font-weight:700;line-height:2.2;margin-bottom:16px;text-align:center}
  .why{background:#f0fdf4;border:2px solid #86efac;border-radius:1.2rem;padding:14px 16px;margin:6px 0 14px;
    font-family:'Noto Naskh Arabic',serif;font-weight:600;color:#14532d;line-height:2.1}
  .why.no{background:#fff7ed;border-color:#fdba74;color:#9a3412}
  .why b{font-family:'Baloo Bhaijaan 2',cursive}
  .nudge{background:#fff7ed;color:#c2410c;border:2px solid #fdba74;border-radius:1.2rem;padding:12px;
    text-align:center;font-weight:800;margin-top:14px}
  .info{background:var(--accent-soft);color:var(--accent-dark);border-radius:1.2rem;padding:14px;
    font-family:'Noto Naskh Arabic',serif;font-weight:700;text-align:center;line-height:2;margin-top:14px}
  .bar-m{height:12px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin-top:4px}
  .bar-m>i{display:block;height:100%;border-radius:999px;transition:width .9s cubic-bezier(.4,0,.2,1)}
  .prog{height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;margin:0 0 18px}
  .prog>i{display:block;height:100%;background:var(--accent);transition:width .4s}

  /* sort */
  .sortword{min-height:96px;display:flex;align-items:center;justify-content:center;text-align:center;
    background:#0f172a;color:#fff;border-radius:1.4rem;font-family:'Noto Naskh Arabic',serif;
    font-size:1.75rem;font-weight:700;padding:16px;margin-bottom:16px;line-height:2}
  .sortword.small{font-size:1.25rem}
  .sortword .say{display:block;font-size:.95rem;color:#94a3b8;font-weight:600}
  .bins{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
  .bins.b3{grid-template-columns:repeat(3,1fr)}
  .bins.b4{grid-template-columns:repeat(2,1fr)}
  @media(min-width:640px){.bins.b4{grid-template-columns:repeat(4,1fr)}}
  .bins.b5{grid-template-columns:repeat(3,1fr)}
  @media(min-width:640px){.bins.b5{grid-template-columns:repeat(5,1fr)}}
  .bin{background:#fff;border:3px solid #e2e8f0;border-bottom:7px solid #cbd5e1;border-radius:1.2rem;
    padding:12px 8px;cursor:pointer;font-family:inherit;font-weight:800;font-size:.98rem;color:var(--ink);
    line-height:1.6;transition:.15s;display:flex;flex-direction:column;align-items:center;gap:2px}
  .bin .bi{font-size:1.6rem}
  .bin:hover{border-color:var(--accent);transform:translateY(-3px)}
  .bin.ok{background:#dcfce7;border-color:#16a34a}.bin.bad{background:#fee2e2;border-color:#ef4444}
  .basket{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;justify-content:center}
  .basket span{font-family:'Noto Naskh Arabic',serif;font-size:.85rem;background:#f1f5f9;border-radius:8px;padding:0 8px}
  .timer{display:flex;justify-content:space-between;font-weight:800;margin-bottom:10px;color:#475569}
  .timer b{color:var(--accent)}

  /* clue */
  .clue{background:linear-gradient(135deg,#ecfeff,#f0fdfa);border:3px solid #67e8f9;border-radius:1.6rem;padding:22px}
  .clue h3{font-size:1.35rem;font-weight:800;color:#0e7490;text-align:center;margin-bottom:6px}
  .clue .idea{font-family:'Noto Naskh Arabic',serif;font-weight:700;color:#155e75;text-align:center;line-height:2.1;margin-bottom:14px}
  .step{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:1.1rem;padding:12px 14px;margin-bottom:10px;
    border:2px solid #cffafe;font-family:'Noto Naskh Arabic',serif;font-weight:600;line-height:2.1}
  .step .n{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:#0891b2;color:#fff;display:flex;
    align-items:center;justify-content:center;font-family:'Baloo Bhaijaan 2';font-weight:800}
  .worked{background:#fffbeb;border:2px dashed #fbbf24;border-radius:1.2rem;padding:14px;margin-top:12px;
    font-family:'Noto Naskh Arabic',serif;line-height:2.2;font-weight:600;color:#78350f}
  .worked .wl{font-family:'Baloo Bhaijaan 2';font-weight:800;color:#b45309;font-size:.85rem}
  .deeper{background:#f5f3ff;border:2px solid #ddd6fe;border-radius:1.2rem;padding:14px;margin-top:12px;
    font-family:'Noto Naskh Arabic',serif;line-height:2.2;font-weight:600;color:#3b1796}
  .deeper .wl{font-family:'Baloo Bhaijaan 2';font-weight:800;color:#5624d0;font-size:.85rem}

  /* build */
  .bword{font-family:'Noto Naskh Arabic',serif;font-size:2rem;font-weight:700;text-align:center;line-height:2.4;
    background:#f8fafc;border-radius:1.4rem;padding:18px;margin-bottom:6px}
  .bword .hole{display:inline-block;min-width:1.3em;border-bottom:4px solid var(--accent);color:var(--accent);padding:0 4px}
  .bword .hole.ok{color:#16a34a;border-color:#16a34a}
  .bctx{text-align:center;font-family:'Noto Naskh Arabic',serif;color:#64748b;font-weight:600;margin-bottom:16px;line-height:2}
  .keys{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:8px}
  .key{background:#fff;border:3px solid #cbd5e1;border-bottom-width:7px;border-radius:1.1rem;min-width:70px;
    padding:8px 16px;font-family:'Noto Naskh Arabic',serif;font-size:1.7rem;font-weight:800;cursor:pointer;color:var(--ink);transition:.15s}
  .key:hover:not(:disabled){border-color:var(--accent);transform:translateY(-3px)}
  .key.ok{background:#dcfce7;border-color:#16a34a}.key.bad{background:#fee2e2;border-color:#ef4444}

  /* fix */
  .hunt{background:#f8fafc;border-radius:1.6rem;padding:20px;font-family:'Noto Naskh Arabic',serif;font-size:1.4rem;line-height:2.8;text-align:justify}
  .w{cursor:pointer;padding:1px 5px;border-radius:8px;transition:.15s;display:inline-block}
  .w:hover{background:#fef3c7}
  .w.hit{background:#16a34a;color:#fff;font-weight:800}
  .w.miss{background:#fde68a}
  .shake{animation:shk .4s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .count{text-align:center;font-weight:800;color:#64748b;margin:12px 0}
  .count b{color:var(--accent)}

  /* dict */
  .dsent{font-family:'Noto Naskh Arabic',serif;font-size:1.5rem;font-weight:700;line-height:2.5;text-align:center;
    background:#fffdf7;border:3px solid #e7d9b5;border-radius:1.4rem;padding:20px;min-height:120px}
  .dsent.hidden{color:transparent;text-shadow:0 0 16px rgba(0,0,0,.25);user-select:none}
  .ring{font-weight:800;text-align:center;color:var(--accent);margin:10px 0;font-size:1.1rem}
  textarea,input.fld{width:100%;border:4px dashed #cbd5e1;border-radius:1.4rem;padding:14px;
    font-family:'Noto Naskh Arabic',serif;font-size:1.15rem;line-height:2.2;outline:none;color:var(--ink);background:#fff}
  textarea{min-height:110px;resize:vertical}
  textarea:focus,input.fld:focus{border-color:var(--accent);background:var(--accent-soft)}
  .diff{font-family:'Noto Naskh Arabic',serif;font-size:1.3rem;line-height:2.6;background:#f8fafc;border-radius:1.2rem;padding:14px;margin-top:12px}
  .diff .good{color:#15803d}.diff .bad{background:#fee2e2;color:#b91c1c;border-radius:6px;padding:0 4px}
  .diff .gone{background:#fef3c7;color:#92400e;border-radius:6px;padding:0 4px;text-decoration:underline dotted}

  /* imla & dictation */
  .stm{font-size:.74rem;font-weight:800;color:#94a3b8;margin-top:4px}
  .pathbox{background:#fff;border:2px solid #e2e8f0;border-radius:1.4rem;padding:14px;margin-top:20px}
  .pathbox .pl{font-weight:800;color:#475569;margin-bottom:10px}
  .pchips{display:flex;flex-wrap:wrap;gap:8px}
  .pchip{font-size:.86rem;font-weight:700;background:#f1f5f9;color:#475569;border-radius:999px;padding:6px 12px;text-decoration:none;border:2px solid transparent}
  .pchip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .tin{width:100%;font-family:inherit;font-size:1.5rem;font-weight:700;text-align:center;padding:14px;border:3px solid #e2e8f0;border-radius:1.2rem;outline:none}
  .tin:focus{border-color:var(--accent)}.tin.ok{border-color:#16a34a;background:#f0fdf4}.tin.bad{border-color:#e11d48;background:#fff1f2}
  .dpass{background:#f8fafc;border:2px dashed #cbd5e1;border-radius:1.4rem;padding:16px;line-height:2.3;font-size:1.2rem;margin:12px 0}
  .dpn{display:inline-block;min-width:1.6em;text-align:center;font-size:.8rem;font-weight:800;color:#fff;background:#94a3b8;border-radius:999px}
  .dhid{color:#94a3b8;font-weight:700;font-size:.95rem}
  .dtg{color:#be123c;background:#ffe4e6;border-radius:.4rem;padding:0 3px}
  .dsent.hidden .dtg{background:transparent;color:transparent}
  .lbox{display:grid;gap:10px;margin-bottom:12px}
  .tcard{background:#fffbeb;border:2px solid #fde68a;border-radius:1.2rem;padding:10px 14px}
  .tcard summary{cursor:pointer;font-weight:800;color:#92400e}
  .tct{font-size:1.35rem;line-height:2.2;margin-top:10px;font-weight:700}
  .tch{font-size:.85rem;color:#a16207;margin-top:6px}
  .ds-wrap .dsent.hidden{display:none}
  .tgw{border-bottom:3px solid currentColor}
  .tgw small{display:block;font-size:.72rem;font-weight:700}
  .diff .bad{color:#be123c;background:#ffe4e6;border-radius:.4rem;padding:0 4px;display:inline-block;line-height:1.5}
  .papw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
  .pw{font-family:inherit;font-size:1.15rem;font-weight:700;background:#fff;border:2px solid #fecdd3;color:#be123c;border-radius:999px;padding:6px 14px;cursor:pointer}
  .pw.on{background:#be123c;color:#fff;border-color:#be123c}
  /* model */
  .model{background:#fffdf7;border:3px solid #e7d9b5;border-radius:1.6rem;padding:22px;box-shadow:0 12px 26px -16px rgba(120,90,20,.45)}
  .model h4{text-align:center;font-weight:800;color:#92400e;font-size:1.25rem;margin-bottom:12px;padding-bottom:10px;border-bottom:2px dashed #e7d9b5}
  .mpart{font-family:'Noto Naskh Arabic',serif;font-size:1.18rem;line-height:2.4;padding:4px 6px;border-radius:10px;transition:.25s}
  .model.show .mpart{background:var(--pc);margin-bottom:8px;padding:10px 12px}
  .mlab{display:none;font-family:'Baloo Bhaijaan 2';font-size:.78rem;font-weight:800;color:#fff;background:var(--pl);
    border-radius:999px;padding:1px 12px;margin-left:6px}
  .model.show .mlab{display:inline-block}
  .authored{font-size:.76rem;font-weight:800;color:#a98a58;text-align:center;margin-top:10px}
  .tips{margin-top:16px;display:grid;gap:10px}
  .tip{background:#fff;border:2px solid #fde68a;border-radius:1.1rem;padding:12px 14px;font-family:'Noto Naskh Arabic',serif;
    font-weight:600;line-height:2.1;color:#57534e}
  .tip b{color:#b45309}

  /* order */
  .ordbox{min-height:60px;border:4px dashed #cbd5e1;border-radius:1.4rem;padding:10px;margin-bottom:14px;background:#f8fafc}
  .ordbox .placed{font-family:'Noto Naskh Arabic',serif;background:#dcfce7;border-radius:1rem;padding:10px 12px;margin-bottom:8px;line-height:2.1;font-weight:600}
  .ordbox .placed b{font-family:'Baloo Bhaijaan 2';font-size:.78rem;color:#fff;background:#16a34a;border-radius:999px;padding:1px 10px;margin-left:6px}
  .ordpick{font-family:'Noto Naskh Arabic',serif;background:#fff;border:3px solid #e2e8f0;border-bottom-width:6px;border-radius:1.1rem;
    padding:10px 14px;margin-bottom:10px;line-height:2.1;cursor:pointer;font-weight:600;transition:.15s;text-align:right;width:100%;font-size:1.05rem;color:var(--ink)}
  .ordpick:hover{border-color:var(--accent)}

  /* compose */
  .cpart{background:#fff;border:3px solid #e2e8f0;border-radius:1.4rem;padding:14px;margin-bottom:12px}
  .cpart .cl{font-weight:800;color:var(--accent);margin-bottom:2px}
  .cpart .cg{font-family:'Noto Naskh Arabic',serif;font-size:.95rem;color:#64748b;font-weight:600;margin-bottom:8px;line-height:1.9}
  .cpart textarea{min-height:80px}
  .wc{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:6px 4px 14px}
  .wc b{color:var(--accent)}
  .checks{background:#f8fafc;border-radius:1.4rem;padding:16px;margin-top:6px}
  .ck{display:flex;gap:10px;align-items:flex-start;font-family:'Noto Naskh Arabic',serif;font-weight:600;line-height:2;padding:4px 0;color:#334155}
  .ck i{font-style:normal;flex-shrink:0}
  .ck input{width:20px;height:20px;margin-top:8px;accent-color:var(--accent)}
  .ck.auto.pass i::before{content:'✅'}.ck.auto.fail i::before{content:'⬜'}
  .hl{font-family:'Noto Naskh Arabic',serif;font-size:1.15rem;line-height:2.5;background:#fff;border:2px solid #e2e8f0;border-radius:1.2rem;padding:14px;margin-top:10px}
  .hl mark{background:#fde68a;border-radius:6px;padding:0 3px}
  .hl mark.err{background:#fecaca}
  .doc{background:#fffdf7;border:3px solid #e7d9b5;border-radius:1.4rem;padding:24px;margin-top:16px;
    font-family:'Noto Naskh Arabic',serif;line-height:2.4;color:#4a3a18;box-shadow:0 12px 26px -16px rgba(120,90,20,.45);white-space:pre-wrap}
  .doc h4{font-family:'Baloo Bhaijaan 2',cursive;font-weight:800;color:#92400e;font-size:1.22rem;
    text-align:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px dashed #e7d9b5;white-space:normal}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

  .st-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;
    padding-top:18px;border-top:2px dashed #e2e8f0}
  .navb{background:#f1f5f9;border:0;border-bottom:5px solid #cbd5e1;border-radius:999px;cursor:pointer;
    font-family:inherit;font-weight:800;color:#475569;padding:11px 16px;font-size:.88rem;
    transition:all .18s cubic-bezier(.175,.885,.32,1.275);max-width:42%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}

function stById(id){for(var i=0;i<STATIONS.length;i++)if(STATIONS[i].id===id)return STATIONS[i];return null}
function acts(){return STATIONS.filter(function(s){return s.kind===L.kind})}

function view(h){$('#app').innerHTML=h;window.scrollTo({top:0,behavior:'instant'})}
function neighbours(){var a=acts(),i=-1;for(var k=0;k<a.length;k++)if(cur&&a[k].id===cur.id){i=k;break}
  return {prev:(i>0?a[i-1]:null),next:(i>=0&&i<a.length-1?a[i+1]:null)}}
function stationNav(){var n=neighbours();
  return '<div class="st-nav">'+
    (n.prev?'<button class="navb" data-goto="'+n.prev.id+'">‹ '+n.prev.ic+' '+n.prev.name+'</button>':'<span></span>')+
    '<button class="navb mid" data-map="1" title="الخريطة">🗺️</button>'+
    (n.next?'<button class="navb" data-goto="'+n.next.id+'">'+n.next.ic+' '+n.next.name+' ›</button>':'<span></span>')+'</div>'}
function setHud(on){$('#hud').classList.toggle('on',on!==false);
  $('#tok').textContent=num(S.tok);$('#stk').textContent=num(S.streak);
  $('#st-name').textContent=cur?(cur.ic+' '+cur.name):'مِداد'}
function toast(txt,good,cb){var t=$('#toast');t.style.background=good?'#16a34a':'#0f8194';t.innerHTML=txt;t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');if(cb)cb()},good?950:1600)}
function rec(v){S.scores[cur.g].push(v)}
function pct(a){return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length*100):0}
function win(first){S.streak++;if(S.streak>S.best)S.best=S.streak;var g=(first?10:5)+Math.min(S.streak,4)*2;S.tok+=g;rec(first?1:.5);setHud();return g}
function lose(){S.streak=0;rec(0);setHud()}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function prog(i,n){return '<div class="prog"><i style="width:'+Math.round(i/n*100)+'%"></i></div>'}
function H(t){return (S.hero==='girl'&&t&&t.tg)?t.tg:(t&&t.t!==undefined?t.t:t)}

/* ============ 🔍 التصنيف (الاكتشاف + الألعاب) ============ */
function rSort(cfg,timed){
  T={cfg:cfg,timed:timed,items:timed?shuffle(cfg.items):cfg.items.slice(),i:0,ok:0,bad:0,left:60,basket:{}};
  cfg.bins.forEach(function(b){T.basket[b.k]=[]});
  if(timed){S.timer=setInterval(function(){T.left--;var e=$('#tl');if(e)e.textContent=num(T.left);
    if(T.left<=0){stopTimer();endSort()}},1000)}
  drawSort();
}
function drawSort(){
  var c=T.cfg,it=T.items[T.i];
  if(!it){return endSort()}
  var nb=c.bins.length;
  view('<div class="card fade" style="margin-top:14px">'+
    '<div class="kicker">'+cur.ic+' '+cur.name+'</div>'+
    '<h2 class="title">'+c.title+'</h2><div class="sub">'+c.prompt+'</div>'+
    (T.timed?'<div class="timer"><span>⏱️ <b id="tl">'+num(T.left)+'</b> ثَانِيَة</span><span>✅ <b>'+num(T.ok)+'</b> · ❌ '+num(T.bad)+'</span></div>'
            :prog(T.i,T.items.length))+
    '<div class="sortword'+(bare(it[0]).length>26?' small':'')+'">'+it[0]+(it[3]?'<span class="say">'+it[3]+'</span>':'')+'</div>'+
    '<div class="bins b'+nb+'">'+c.bins.map(function(b){
      return '<button class="bin" data-bin="'+b.k+'"><span class="bi">'+b.ic+'</span><span>'+b.n+'</span>'+
        (!T.timed?'<span class="basket">'+T.basket[b.k].map(function(w){return '<span>'+w+'</span>'}).join('')+'</span>':'')+'</button>'}).join('')+'</div>'+
    '<div id="fb"></div>'+stationNav()+'</div>');
}
function pickBin(k,btn){
  var it=T.items[T.i];if(!it||T.lock)return;
  var ok=(k===it[1]);
  if(ok){btn.classList.add('ok');T.ok++;T.basket[k].push(it[0]);
    if(T.timed){S.tok+=4;setHud();T.i++;setTimeout(drawSort,180);return}
    var g=win(true);T.lock=true;
    if(it[2]){$('#fb').innerHTML='<div class="why">✅ '+it[2]+'</div><button class="btn-3d btn-accent" data-snext="1">التَّالِي ▶</button>';return}
    toast(cheer()+' +'+num(g)+' 🪙',true,function(){T.lock=false;T.i++;drawSort()});
  }else{
    btn.classList.add('bad','shake');T.bad++;
    if(T.timed){S.streak=0;setHud();var right=T.cfg.bins.filter(function(b){return b.k===it[1]})[0];
      T.lock=true;toast('↩️ '+right.ic+' '+right.n+(it[2]?' — '+it[2]:''),false,function(){T.lock=false;T.i++;drawSort()});return}
    lose();T.lock=true;
    var rb=T.cfg.bins.filter(function(b){return b.k===it[1]})[0];
    T.basket[it[1]].push(it[0]);
    $('#fb').innerHTML='<div class="why no">مَكَانُهَا: <b>'+rb.ic+' '+rb.n+'</b>'+(it[2]?'<br>'+it[2]:'')+'</div>'+
      '<button class="btn-3d btn-accent" data-snext="1">التَّالِي ▶</button>';
  }
}
function endSort(){
  stopTimer();
  var c=T.cfg;
  if(T.timed){var tot=T.ok+T.bad;rec(tot?T.ok/tot:0);S.tok+=T.ok*2;setHud()}
  view('<div class="card fade" style="margin-top:14px;text-align:center">'+
    '<div class="kicker">'+cur.ic+' '+cur.name+'</div>'+
    (T.timed?'<div style="font-size:3rem">🏁</div><h2 class="title">'+num(T.ok)+' إِجَابَةً صَحِيحَة</h2><div class="sub">مِنْ '+num(T.ok+T.bad)+' فِي سِتِّينَ ثَانِيَة'+(T.bad?' — رَاجِعِ الْقَرِينَةَ وَأَعِدِ الْمُحَاوَلَة':'')+'</div>'
            :'<div style="font-size:3rem">💡</div><h2 class="title">مَاذَا لَاحَظْتَ؟</h2>')+
    (c.reveal&&!T.timed?'<div class="clue" style="text-align:right"><div class="idea" style="margin:0">'+c.reveal+'</div></div>':'')+
    (!T.timed?'<div class="bins b'+c.bins.length+'" style="margin-top:14px">'+c.bins.map(function(b){
      return '<div class="bin" style="cursor:default"><span class="bi">'+b.ic+'</span><span>'+b.n+'</span><span class="basket">'+
        T.basket[b.k].map(function(w){return '<span>'+w+'</span>'}).join('')+'</span></div>'}).join('')+'</div>':'')+
    '<div style="margin-top:18px">'+(T.timed?'<button class="btn-3d btn-ghost" data-again="1" style="margin-bottom:10px">🔄 حَاوِلْ مَرَّةً أُخْرَى</button>':'')+
    '<button class="btn-3d btn-accent" data-fin="1">أَنْهَيْتُ ✓</button></div>'+stationNav()+'</div>');
}

/* ============ ✍️ الإملاء: نصّ كامل جملةً جملة ============ */
function nS(s){return bare(String(s)).replace(/[ٱ]/g,'ا').replace(/ی/g,'ي').replace(/ک/g,'ك').replace(/[«»"'،,.؛;:؟?!…—\-()\[\]]/g,' ').replace(/\s+/g,' ').trim()}
function nT(s){var x=nS(s);return L.tech.dictation.hamza?x:x.replace(/[أإآ]/g,'ا')}
function nL(s){return nS(s).replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[ؤئ]/g,'ء')}
function dToks(raw){return raw.split(/\s+/).filter(Boolean).map(function(w){
  return {raw:w.replace(/[\[\]]/g,''),tg:/\[/.test(w)||/\]/.test(w),s:nS(w),l:nL(w)}}).filter(function(x){return x.s})}
function dPlain(raw){return raw.replace(/[\[\]]/g,'')}
function dMarked(raw){return raw.replace(/\[([^\]]+)\]/g,'<b class="dtg">$1</b>')}
function alignW(E,G){
  var m=E.length,n=G.length,d=[],i,j;
  for(i=0;i<=m;i++){d.push([]);for(j=0;j<=n;j++)d[i][j]=i===0?j:(j===0?i:0)}
  for(i=1;i<=m;i++)for(j=1;j<=n;j++){var sub=d[i-1][j-1]+(E[i-1].l===nL(G[j-1])?0:1);d[i][j]=Math.min(sub,d[i-1][j]+1,d[i][j-1]+1)}
  var pr={};i=m;j=n;
  while(i>0&&j>0){var c=E[i-1].l===nL(G[j-1])?0:1;
    if(d[i][j]===d[i-1][j-1]+c){pr[i-1]=G[j-1];i--;j--}else if(d[i][j]===d[i-1][j]+1)i--;else j--}
  return pr}
var VOICE=null;

function arVoice(){try{var v=speechSynthesis.getVoices().filter(function(x){return /^ar/i.test(x.lang)});return v[0]||null}catch(e){return null}}
try{if(window.speechSynthesis)speechSynthesis.onvoiceschanged=function(){VOICE=arVoice()}}catch(e){}
function speak(txt){
  VOICE=VOICE||arVoice();
  if(!window.speechSynthesis||!VOICE){toast('لَا يُوجَدُ صَوْتٌ عَرَبِيٌّ فِي جِهَازِك — يُمْلِيهَا الْمُعَلِّمُ مِنْ بِطَاقَتِه 👩‍🏫',false);return}

}

  setTimeout(function(){var t=$('#dt');if(t)t.focus()},60);

function lcs(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d.push(new Array(n+1).fill(0))}
  for(i=m-1;i>=0;i--)for(j=n-1;j>=0;j--)d[i][j]=a[i]===b[j]?d[i+1][j+1]+1:Math.max(d[i+1][j],d[i][j+1]);
  var out=[];i=0;j=0;while(i<m&&j<n){if(a[i]===b[j]){out.push([i,j]);i++;j++}else if(d[i+1][j]>=d[i][j+1])i++;else j++}return out}
function checkDict(){
  var d=L.tech.dict,v=($('#dt')||{}).value||'';
  var clean=function(s){return bare(s).replace(/[«»"'،,.؛;:؟?!…—\-()]/g,' ')};
  var exp=words(clean(d.s)),got=words(clean(v));
  if(got.length<2){$('#dr').innerHTML='<div class="nudge">اكْتُبِ الْجُمْلَةَ أَوَّلًا ✍️</div>';return}
  var pairs=lcs(exp,got),okE={};pairs.forEach(function(p){okE[p[0]]=1});
  var sc=pairs.length/exp.length;sc=Math.max(0,sc-T.peeks*.1);rec(sc);
  if(sc>=.9){S.streak++;if(S.streak>S.best)S.best=S.streak}else S.streak=0;S.tok+=Math.round(sc*20);setHud();
  var origW=words(d.s);
  $('#ds').classList.remove('hidden');
  $('#dr').innerHTML='<div class="diff">'+exp.map(function(w,i){return okE[i]?'<span class="good">'+(origW[i]||w)+'</span>':'<span class="gone">'+(origW[i]||w)+'</span>'}).join(' ')+'</div>'+
    '<div class="why'+(sc>=.9?'':' no')+'">'+(sc>=.99?'💯 إِمْلَاءٌ كَامِل!':'صَحِيحٌ '+num(pairs.length)+' مِنْ '+num(exp.length)+' كَلِمَة. الْمُعَلَّمُ بِالْأَصْفَرِ كَتَبْتَهُ بِشَكْلٍ مُخْتَلِفٍ أَوْ نَسِيتَه.')+'</div>'+
    '<button class="btn-3d btn-accent" data-fin="1">أَنْهَيْتُ ✓</button>';

}

      if(a.distinct&&m){var u={};m.forEach(function(x){u[x]=1});n=Object.keys(u).length}

    (hl.errs?'<div class="nudge">🟥 فِي نَصِّكَ '+num(hl.errs)+' كَلِمَةً تَحْتَاجُ مُرَاجَعَةً (بِالْأَحْمَر)</div>':'')+'</div>'+

function copied(txt,src){if(!src)return false;var a=words(bare(txt)),s=' '+words(src).join(' ')+' ';
  for(var i=0;i+5<=a.length;i++){if(s.indexOf(' '+a.slice(i,i+5).join(' ')+' ')>=0)return true}return false}

  var html=esc(t).split('\n').map(function(line){return line.split(/(\s+)/).map(function(tok){

  return {html:html,errs:errs}}
